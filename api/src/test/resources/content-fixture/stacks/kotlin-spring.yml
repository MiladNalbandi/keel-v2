name: kotlin-spring
lane: api
detect:
  files: [gradlew, build.gradle.kts]
  extensions: ['.kt']
layers:
  - id: unit
    what: pure rules
commands:
  api_test_ac: "{BUILD} -q test --tests '*{AC}*'"
tools:
  detekt:
    run: '{BUILD} -q detekt'
    on: manual
    fail: block
  ktlint:
    run: '{BUILD} -q ktlintCheck'
    on: pre-commit
    match: '\.kts?$'
    fail: block
    description: 'Refuse a commit whose Kotlin breaks the ktlint rules'
  sonar: false
skills:
  testing: kotlin-spring-testing
