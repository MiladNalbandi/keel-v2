# The Supervisor as a plugin (docs/plans/supervisor.md), on per project (Control › Plugins). A general agent on a strong model that watches a project's
# flows, looks at each gate from the project's context, and answers it or calls the person. The version must equal
# VERSION in engine/keel_plugin_supervisor/__init__.py (engine/tests/test_supervisor.py checks it). Each part is
# written on one line (scripts/build-plugin.sh reads them).
schema: 1
name: supervisor
title: Supervisor
version: 0.2.0
publisher: keel
summary: a strong model that watches your flows, answers their gates from the project's own context, and calls you when it is unsure, stuck or out of budget.
requires:
  sdk: 1
  keel: ">=0.21.0"   # the slots flow.chip and inbox.note, gate_kind on gate.decided, a fix run's guard (shell_readonly)
parts:
  engine: { path: engine, package: keel_plugin_supervisor }
  api: { jars: [api/keel-plugin-supervisor.jar] }
  web: { entry: web/index.js }
  content: content
per_project: true
contributes:
  tui:
    commands:
      - name: supervisor
        args: "<status|on|off|follow|keel-on|keel-off|flow-on|flow-off|flow-follow|shadow|act|log>"
        summary: turn the Supervisor on or off (keel-wide, this project, the flow now), its mode, and what it decided
        sub:
          status:
            summary: each switch - keel-wide, this project, the plugin - and whether it runs here
            call: { path: "/projects/{pid}/supervisor/switch" }
            show: { title: "{text}" }
          "on":
            summary: turn it on for this project
            confirm: Turn the Supervisor on for this project? Its turns cost tokens.
            call: { method: POST, path: "/projects/{pid}/supervisor/switch", body: { "on": true } }
            show: { title: "{text}" }
          "off":
            summary: turn it off for this project (a running look stops at once)
            confirm: Turn the Supervisor off for this project?
            call: { method: POST, path: "/projects/{pid}/supervisor/switch", body: { "on": false } }
            show: { title: "{text}" }
          follow:
            summary: this project follows the keel-wide switch again
            confirm: Let this project follow the keel-wide switch?
            call: { method: POST, path: "/projects/{pid}/supervisor/switch", body: { "on": null } }
            show: { title: "{text}" }
          keel-on:
            summary: turn it on for the whole keel (each project follows, unless it says otherwise)
            confirm: Turn the Supervisor on for the whole keel? Its turns cost tokens.
            call: { method: POST, path: "/supervisor/switch", body: { "on": true } }
            show: { title: "{text}" }
          keel-off:
            summary: turn it off everywhere - nothing listens and no model is called
            confirm: Turn the Supervisor off for the whole keel?
            call: { method: POST, path: "/supervisor/switch", body: { "on": false } }
            show: { title: "{text}" }
          flow-on:
            summary: turn it on for the flow now only
            confirm: Turn the Supervisor on for the flow now?
            call: { method: POST, path: "/projects/{pid}/supervisor/flow", body: { "on": true } }
            show: { title: "Supervisor for this flow: {settings.on}{note}" }
          flow-off:
            summary: turn it off for the flow now only (a running look stops at once)
            confirm: Turn the Supervisor off for the flow now?
            call: { method: POST, path: "/projects/{pid}/supervisor/flow", body: { "on": false } }
            show: { title: "Supervisor for this flow: {settings.on}{note}" }
          flow-follow:
            summary: the flow now follows the project's switch again
            confirm: Let the flow follow the project's switch?
            call: { method: POST, path: "/projects/{pid}/supervisor/flow", body: { "on": null } }
            show: { title: "Supervisor for this flow: {settings.on}{note}" }
          shadow:
            summary: it only suggests; you answer every gate
            confirm: Let the Supervisor only suggest from now on?
            call: { method: POST, path: "/projects/{pid}/supervisor/flow", body: { mode: shadow } }
            show: { title: "Supervisor mode {settings.mode}{note}" }
          act:
            summary: it answers the gates it may when it is sure, and asks you about the rest
            confirm: Let the Supervisor answer gates by itself when it is sure?
            call: { method: POST, path: "/projects/{pid}/supervisor/flow", body: { mode: act } }
            show: { title: "Supervisor mode {settings.mode}{note}" }
          log:
            summary: its last decisions in this project, with their reasons
            call: { path: "/projects/{pid}/supervisor/decisions?limit=15" }
            show: { items: decisions, line: "{step} {ac}  {outcome} {decision}  ({confidence}, {tokens} tokens)  {summary}", empty: "it has not looked at anything yet", max: 15 }
