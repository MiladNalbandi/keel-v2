# Library as a plugin. scripts/build-plugin.sh packs it: library-<version>.kplug. The version must equal VERSION in
# engine/keel_plugin_library/__init__.py (engine/tests checks it). Each part is written on one line (scripts/build-plugin.sh
# reads them). Agents get its read tools only in a project that turned it on, and only documents marked for agents.
schema: 1
name: library
title: Library
version: 0.1.0
publisher: keel
summary: Your company's policies and rules in one place, which agents can search and quote with the source. You decide what they may read.
requires:
  sdk: 1
parts:
  engine: { path: engine, package: keel_plugin_library }
  api: { jars: [api/keel-plugin-library.jar] }
  web: { entry: web/index.js }
  content: content
  migrations: migrations
per_project: true
permissions:
  agent_tools: read
  tables: [library_doc]
  pages: true
