# Links as a plugin. scripts/build-plugin.sh packs it: links-<version>.kplug. The first system is Linear; another system is
# another file in the engine part. The version must equal VERSION in engine/keel_plugin_links/__init__.py. Reads need the key the
# person added; a write always waits for the person's OK in the Inbox (keel_engine/approvals.py). Each part is on one line.
schema: 1
name: links
title: Links
version: 0.1.0
publisher: keel
summary: Link keel to Linear with your own key. Agents read issues, and a comment or a new issue happens only after your OK in the Inbox.
requires:
  sdk: 1
parts:
  engine: { path: engine, package: keel_plugin_links }
  api: { jars: [api/keel-plugin-links.jar] }
  web: { entry: web/index.js }
  content: content
per_project: true
permissions:
  secrets: [links-linear]
  network: [from-connections]
  agent_tools: act
  pages: true
