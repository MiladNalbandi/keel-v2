# The Map as a plugin (docs/plugins/11-step3-contract.md). scripts/build-plugin.sh packs it: map-<version>.kplug.
# Paths are relative to the plugin folder. The version must equal VERSION in engine/keel_plugin_map/__init__.py
# (engine/tests/test_map_part.py checks it). Each part is written on one line (scripts/build-plugin.sh reads them).
schema: 1
name: map
title: Map
version: 1.0.0
publisher: keel
summary: How the project is built, level by level - the system, its modules and endpoints, and the database diagram.
requires:
  sdk: 1
parts:
  engine: { path: engine, package: keel_plugin_map }
  api: { jars: [api/keel-plugin-map.jar] }
  web: { entry: web/index.js }
per_project: false
