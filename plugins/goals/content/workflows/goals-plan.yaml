id: goals-plan
name: plan a goal
keel_rules: true
own_branch: false
version: 1
about: An agent splits one goal into steps, each one flow. You approve the plan; then you start each step yourself.
# Started from the Goals page (the plugin's api), with the goal as the flow's request. The agent only reads. The gate is a person's: no run
# mode and no Supervisor answers it. The plugin reads the plan from the gate's event and makes the steps when it hears the approval.
steps:
  - id: plan
    kind: agent
    name: split the goal into steps
    agent: goals-planner
    model: default
    phase: review
    keep: true
  - { id: plan_gate, kind: gate, name: the plan for this goal, phase: gate, person: true, lock: true, back: plan, when: { data: plan_text } }
