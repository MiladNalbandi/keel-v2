[project]
name = "keel-engine"
version = "0.26.0"
description = "keel v2 engine: runs keel workflows as LangGraph graphs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "anthropic[vertex]>=1.0",       # #101 keel's harness: Claude's Messages API (and AnthropicVertex on Vertex AI)
    "openai>=3.0",                  # #101 keel's harness: OpenAI, GitHub Models, local servers, Gemini on Vertex
    "jsonschema>=4.0",              # #101 keel's harness checks every tool input against its schema
    "langchain-openai>=0.3",
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.9",
    "sqlglot>=26",
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
    "cryptography>=44",
]

[project.scripts]
keel-engine = "keel_engine.main:run"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keel_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
