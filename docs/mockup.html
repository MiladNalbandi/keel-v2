<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>keel v2 Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — fixed left rail of screens, one working pane; keel's own warm-paper / ink palette, purple accent. */
:root {
  --bg: #f7f6f3; --panel: #ffffff; --panel-2: #f1efea; --fg: #131314; --dim: #6f6b63; --faint: #9b968c;
  --border: #e3e0d9; --rail: #d9d5cc;
  --accent: #7a5cff; --accent-soft: #ece6ff; --on-accent: #ffffff;
  --ok: #1f8a4c; --ok-soft: #e3f3e9; --run: #0b74c4; --run-soft: #e2effa;
  --warn: #b26a00; --warn-soft: #fbefd9; --bad: #c0392b; --bad-soft: #f8e1de;
  --shadow: 0 8px 30px rgba(19,19,20,.12);
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131314; --panel: #1a1a1c; --panel-2: #222225; --fg: #f7f6f3; --dim: #9a958c; --faint: #6b675f;
  --border: #2c2c30; --rail: #333338;
  --accent: #a48bff; --accent-soft: #2a2342; --on-accent: #131314;
  --ok: #4ec07c; --ok-soft: #173225; --run: #57aeff; --run-soft: #142a3d;
  --warn: #e0a13a; --warn-soft: #36290f; --bad: #f0685a; --bad-soft: #3a1d1a;
  --shadow: 0 8px 30px rgba(0,0,0,.5); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #131314; --panel: #1a1a1c; --panel-2: #222225; --fg: #f7f6f3; --dim: #9a958c; --faint: #6b675f;
  --border: #2c2c30; --rail: #333338;
  --accent: #a48bff; --accent-soft: #2a2342; --on-accent: #131314;
  --ok: #4ec07c; --ok-soft: #173225; --run: #57aeff; --run-soft: #142a3d;
  --warn: #e0a13a; --warn-soft: #36290f; --bad: #f0685a; --bad-soft: #3a1d1a;
  --shadow: 0 8px 30px rgba(0,0,0,.5); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--f-mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 220px minmax(0,1fr); min-height: 100%; }
.side { border-right: 1px solid var(--border); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand svg { width: 34px; height: 20px; }
.brand b { font-size: 16px; letter-spacing: -.01em; }
.brand span { font-size: 11px; color: var(--dim); border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 7px; color: var(--dim); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--panel-2); color: var(--fg); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--fg); }
.nav .count { font-size: 11px; min-width: 20px; text-align: center; border-radius: 999px; padding: 0 6px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.nav .count.run { background: var(--run-soft); color: var(--run); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--dim); padding: 0 8px; }
.side-foot .row { display: flex; align-items: center; gap: 6px; }

main { padding-inline: 28px; padding-block: 22px 60px; min-width: 0; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.top h1 { font-size: 22px; line-height: 1.2; margin: 0; letter-spacing: -.015em; text-wrap: balance; }
.top p { margin: 4px 0 0; color: var(--dim); max-width: 70ch; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { border: 1px solid var(--border); background: var(--panel); border-radius: 7px; padding: 6px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.warn { background: var(--warn); border-color: var(--warn); color: var(--bg); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }

.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.panel-head h2 { font-size: 13px; margin: 0; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600; }
.panel-body { padding: 14px 16px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: minmax(0,1.6fr) minmax(0,1fr); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }

.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-ok { background: var(--ok-soft); color: var(--ok); }
.p-run { background: var(--run-soft); color: var(--run); }
.p-run::before { animation: pulse 1.4s infinite; }
.p-warn { background: var(--warn-soft); color: var(--warn); }
.p-bad { background: var(--bad-soft); color: var(--bad); }
.p-idle { background: var(--panel-2); color: var(--dim); }
.tag { display: inline-block; border: 1px solid var(--border); border-radius: 5px; padding: 0 6px; font-size: 11.5px; color: var(--dim); font-family: var(--f-mono); white-space: nowrap; }
.tag.keel { border-color: var(--accent); color: var(--accent); }
.tag.star { border-color: var(--warn); color: var(--warn); }
.prov { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.prov i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.c-claude { background: #e2725b; } .c-codex { background: #3fa37a; } .c-copilot { background: #6e7bff; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--panel-2); }
.sub { color: var(--dim); font-size: 12.5px; }

.tabs { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; padding: 2px; background: var(--panel); }
.tabs button { border: 0; background: transparent; padding: 4px 12px; border-radius: 6px; cursor: pointer; color: var(--dim); font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--fg); }

/* Flow graph */
.graph-wrap { overflow-x: auto; padding: 6px 0; }
.graph { width: 100%; min-width: 860px; height: auto; display: block; }
.graph .edge { fill: none; stroke: var(--rail); stroke-width: 1.6; }
.graph .edge.done { stroke: var(--ok); }
.graph .edge.loop { stroke-dasharray: 4 4; stroke: var(--faint); }
.graph .node rect, .graph .node path { stroke-width: 1.6; }
.graph .node text { font: 500 11.5px var(--f-mono); fill: var(--fg); }
.graph .node .lbl2 { font: 400 10px var(--f-body); fill: var(--dim); }
.graph .n-todo rect, .graph .n-todo path { fill: var(--panel); stroke: var(--rail); }
.graph .n-done rect, .graph .n-done path { fill: var(--ok-soft); stroke: var(--ok); }
.graph .n-run rect, .graph .n-run path { fill: var(--run-soft); stroke: var(--run); }
.graph .n-run rect { animation: glow 1.6s ease-in-out infinite; }
.graph .n-wait path, .graph .n-wait rect { fill: var(--warn-soft); stroke: var(--warn); }
.graph .n-custom rect { fill: var(--panel); stroke: var(--warn); stroke-dasharray: 3 3; }
.graph .looplbl { font: 400 10px var(--f-body); fill: var(--faint); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid; display: inline-block; }

.interrupt { border: 1.5px solid var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.interrupt h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.interrupt .facts { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--dim); }
.interrupt textarea { width: 100%; min-height: 54px; border: 1px solid var(--border); background: var(--panel); border-radius: 7px; padding: 8px; resize: vertical; }
.running-card { border: 1.5px solid var(--run); background: var(--run-soft); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; }

.acs { display: flex; gap: 8px; flex-wrap: wrap; }
.ac { border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; display: grid; gap: 2px; min-width: 170px; background: var(--panel); }
.ac b { font-family: var(--f-mono); font-size: 12px; }

.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 38px 70px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--border); }
.timeline li:last-child { border-bottom: 0; }
.timeline li.head { color: var(--fg); font-weight: 600; }
.timeline .cp { font-family: var(--f-mono); font-size: 12px; color: var(--faint); }
.timeline .t { font-family: var(--f-mono); font-size: 12px; color: var(--dim); }

.events { display: grid; gap: 4px; font-size: 12.5px; }
.events div { display: grid; grid-template-columns: 50px 56px minmax(0,1fr); gap: 8px; }
.events .k { font-family: var(--f-mono); font-size: 11.5px; color: var(--accent); }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(19,19,20,.35); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); border-left: 1px solid var(--border); box-shadow: var(--shadow); z-index: 21; display: flex; flex-direction: column; }
.drawer header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 14px; border-bottom: 1px solid var(--border); }
.drawer header h2 { margin: 0; font-size: 17px; }
.drawer .body { padding: 16px 18px; overflow-y: auto; display: grid; gap: 16px; align-content: start; }
.drawer footer { padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.field { display: grid; gap: 6px; }
.field > label:not(.radio):not(.chk), .field > .lab { font-size: 12px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
.field input[type=text], .field input[type=password], .field select, .field textarea { border: 1px solid var(--border); background: var(--bg); border-radius: 7px; padding: 7px 9px; width: 100%; }
.field textarea { min-height: 110px; font-family: var(--f-mono); font-size: 12.5px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > * { min-width: 0; }
.radio { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
.radio:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.radio input { margin-top: 3px; }
.field .radio select, .row select { width: auto; max-width: 100%; }
.chk { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.hint { font-size: 12px; color: var(--dim); }

/* Jobs feed */
.feed { display: grid; gap: 8px; }
.step { display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 10px; }
.step .t { font-family: var(--f-mono); font-size: 11.5px; color: var(--faint); padding-top: 2px; }
.step .box { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--bg); min-width: 0; }
.step .kind { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-right: 6px; }
.k-text { color: var(--dim); } .k-tool { color: var(--accent); } .k-edit { color: var(--run); } .k-answer { color: var(--ok); } .k-guard { color: var(--bad); }
pre.diff { margin: 6px 0 0; overflow-x: auto; font: 12px/1.5 var(--f-mono); }
pre.diff .a { color: var(--ok); } pre.diff .d { color: var(--bad); }

/* Connections */
.conn { display: grid; grid-template-columns: 180px minmax(0,1fr); gap: 16px; padding: 16px; border-bottom: 1px solid var(--border); }
.conn:last-child { border-bottom: 0; }
.conn h3 { margin: 0; font-size: 15px; }
.modes { display: grid; gap: 8px; }
.checks { display: flex; gap: 10px; flex-wrap: wrap; }
.check { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; font-size: 12.5px; }
.check .ok { color: var(--ok); font-weight: 700; } .check .no { color: var(--bad); font-weight: 700; }

.matrix td, .matrix th { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }

.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; box-shadow: var(--shadow); z-index: 40; font-weight: 500; max-width: calc(100% - 32px); }
.mock-note { font-size: 11.5px; color: var(--faint); border: 1px dashed var(--border); border-radius: 6px; padding: 3px 8px; }
.empty { color: var(--dim); padding: 18px 0; text-align: center; }


/* Workflows */
.whead, .wstep { display: grid; grid-template-columns: 92px minmax(0,1fr) minmax(0,150px) 56px; gap: 10px; align-items: center; }
.whead { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; padding: 0 10px 6px; }
.wstep { width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; }
.wstep:hover { border-color: var(--faint); }
.wstep.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.wstep.in-loop { margin-left: 14px; width: calc(100% - 14px); }
.wstep.loop-end { margin-bottom: 14px; }
.wstep.k-gate { background: var(--warn-soft); border-color: var(--warn); }
.wstep.k-code { border-radius: 3px; }
.wkind { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
.wname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wtok { text-align: right; color: var(--dim); }
.loop-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 600; font-size: 12.5px; color: var(--accent); margin: 4px 0 6px; padding-left: 4px; border-left: 2px solid var(--accent); }
pre.yaml { margin: 0; font: 12.5px/1.6 var(--f-mono); overflow-x: auto; }
.est-big { display: grid; gap: 2px; }
.est-big .num { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.est-box { border: 1.5px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; }
.est-box .lab { font-size: 12px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
.stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--panel-2); }
.stack i { display: block; height: 100%; }
.kv { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; font-size: 13px; }
.kv span { color: var(--dim); }
/* Budget */
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.big { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
.big .sub { font-size: 12.5px; font-weight: 400; letter-spacing: 0; }
.meter { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; }
.m-ok i { background: var(--ok); } .m-warn i { background: var(--warn); } .m-bad i { background: var(--bad); }
.meter2 { position: relative; height: 12px; border-radius: 6px; background: var(--panel-2); }
.meter2 .used { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 6px; }
.meter2 .est { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--fg); }
.chart { width: 100%; min-width: 480px; height: auto; display: block; }
.chart .ax { font: 10.5px var(--f-mono); fill: var(--faint); }
.fill-claude { fill: #e2725b; } .fill-codex { fill: #3fa37a; } .fill-copilot { fill: #6e7bff; }
/* Live */
.live-grid { display: grid; grid-template-columns: minmax(0,300px) minmax(0,1fr); gap: 16px; align-items: start; }
.lab-s { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; }
.agent-card { text-align: left; display: grid; gap: 6px; border: 1px solid var(--border); background: var(--panel); border-radius: 10px; padding: 10px 12px; cursor: pointer; width: 100%; }
.agent-card.sel { border-color: var(--run); box-shadow: 0 0 0 1px var(--run); }
.mini { display: flex; gap: 6px; align-items: baseline; min-width: 0; overflow: hidden; white-space: nowrap; }
.mini .kind { font-size: 10px; font-weight: 600; text-transform: uppercase; }
.fin { display: grid; gap: 1px; padding: 6px 10px; border-bottom: 1px dashed var(--border); font-size: 13px; }
.live-feed { max-height: 520px; overflow-y: auto; padding-right: 4px; }
.k-thinking { color: var(--dim); }
.result { margin-top: 8px; border: 1.5px solid var(--ok); border-radius: 8px; padding: 10px; display: grid; gap: 8px; background: var(--panel); }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 900px) { .live-grid { grid-template-columns: minmax(0,1fr); } .whead, .wstep { grid-template-columns: 70px minmax(0,1fr) 50px; } .wmodel { display: none; } .whead span:nth-child(3) { display: none; } }
@media (max-width: 520px) { .g4 { grid-template-columns: minmax(0,1fr); } }


tr.rowsel td { background: var(--accent-soft); }
button.skilltag { cursor: pointer; background: var(--panel); }
button.skilltag:hover { border-color: var(--accent); color: var(--accent); }

/* Grouped navigation */
.nav { gap: 14px; }
.nav-groups { display: none; }
.nav-sec { display: flex; flex-direction: column; gap: 2px; }
.nav-h { display: flex; flex-direction: column; padding: 0 10px 4px; }
.nav-h span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 700; }
.nav-h small { font-size: 11px; color: var(--faint); }
.nav-sec.cur .nav-h span { color: var(--accent); }
.crumb { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 700; margin-bottom: 2px; min-height: 1em; }
@media (max-width: 900px) {
  .side { flex-direction: column; align-items: stretch; gap: 8px; overflow: visible; }
  .side .brand { display: none; }
  .nav { flex-direction: column; gap: 8px; }
  .nav-groups { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 4px; border: 1px solid var(--border); border-radius: 9px; padding: 3px; background: var(--panel); }
  .nav-groups button { border: 0; background: transparent; border-radius: 7px; padding: 6px 4px; font-weight: 600; color: var(--dim); cursor: pointer; display: inline-flex; justify-content: center; gap: 6px; align-items: center; }
  .nav-groups button[aria-selected="true"] { background: var(--accent-soft); color: var(--fg); }
  .nav-sec { display: none; flex-direction: row; overflow-x: auto; gap: 4px; }
  .nav-sec.cur { display: flex; }
  .nav-h { display: none; }
}
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
@keyframes glow { 0%,100% { stroke-opacity: 1 } 50% { stroke-opacity: .35 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0,1fr); }
  .side { position: sticky; height: auto; flex-direction: row; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; gap: 12px; overflow-x: auto; background: var(--bg); z-index: 10; border-right: 0; border-bottom: 1px solid var(--border); top: 0; }
  .nav { flex-direction: row; }

    checkpoints.unshift({ n: checkpoints[0].n + 1, node: "ac-gate", t: clockNow(), note: `${ac.id} sent back: "${why}"` });
    projects[0].wait = 0; projects[0].phase = "red";
    toast("Sent back. test-author gets your reason in its prompt."); render();
  };
  document.querySelectorAll("[data-rewind]").forEach(b => b.onclick = () => {
    const i = +b.dataset.rewind, cp = checkpoints[i];
    checkpoints = checkpoints.slice(i);
    flowState.current = ORDER.includes(cp.node) ? cp.node : "spec";
    flowState.status = NODES.find(n => n.id === flowState.current)?.k === "gate" ? "wait" : "run";
    toast(`Rewound to checkpoint #${cp.n}. A new branch starts here; the old one stays in history.`); render();

}

function stepEstimate(s, nAc = acCount) {
  if (!s.model) return { tok: 0, cost: 0, prem: 0, calls: 0 };
  const m = MODELS[s.model], times = (s.perAc ? nAc : 1) * (s.count || 1) * (1 + (s.retry || 0));
  const tin = s.tin * 1e3 * times, tout = s.tout * 1e3 * times;
  return { tok: tin + tout, cost: (tin * m.in + tout * m.out) / 1e6, prem: m.premium ? Math.ceil(times * 6) : 0, calls: times };
}
function wfEstimate(w = wf(), nAc = acCount) {

  return { tok, low: tok * 0.7, high: tok * 1.6, cost, prem, by };
}

/* ---------- graph renderer v2: same look, plus edit mode and custom connections ---------- */
function autoGraph(steps, o = {}) {
  const PER = o.per || 8, W = 1000, NW = 96, NH = 36, ROWH = o.edit ? 160 : (o.tokens ? 150 : 140), X0 = 60, X1 = 940;
  const rowsN = Math.max(1, Math.ceil(steps.length / PER));
  const H = (o.edit ? 70 : 40) + rowsN * ROWH - (o.edit ? 20 : o.tokens ? 30 : 40);
  const stepX = (X1 - X0) / Math.max(1, PER - 1), top = o.edit ? 80 : 60;
  const pos = steps.map((s, i) => { const r = Math.floor(i / PER), c = i % PER; return { x: r % 2 ? X1 - c * stepX : X0 + c * stepX, y: top + r * ROWH, r }; });
  const idx = id => steps.findIndex(s => s.id === id);
  const cur = idx(o.current);
  const state = i => o.current == null ? "todo" : i < cur ? "done" : i === cur ? (steps[i].kind === "gate" ? "wait" : "run") : "todo";
  const short = t => t.length > 15 ? t.slice(0, 14) + "…" : t;
  const half = s => s.kind === "gate" ? 36 : NW / 2;
  let edges = "", nodes = "", plus = "";
  for (let i = 0; i < steps.length - 1; i++) {
    const a = pos[i], b = pos[i + 1], done = state(i + 1) !== "todo" ? " done" : "";
    let mx, my;
    if (a.r === b.r) { const d = b.x > a.x ? 1 : -1; edges += `<path class="edge${done}" d="M${a.x + d * half(steps[i])} ${a.y} L${b.x - d * half(steps[i + 1])} ${b.y}" marker-end="url(#arr)"/>`; mx = (a.x + b.x) / 2; my = a.y; }
    else { edges += `<path class="edge${done}" d="M${a.x} ${a.y + (steps[i].lanes ? 44 : NH / 2 + (steps[i].kind === "gate" ? 4 : 0))} L${b.x} ${b.y - NH / 2 - (steps[i + 1].kind === "gate" ? 4 : 0)}" marker-end="url(#arr)"/>`; mx = a.x; my = (a.y + b.y) / 2; }
    if (steps[i].kind === "branch") edges += `<text class="looplbl" x="${mx}" y="${my - 8}" text-anchor="middle">yes</text>`;
    if (o.edit) plus += `<g class="gplus ${o.insertAt === i ? "on" : ""}" data-wins="${i}" role="button" aria-label="Insert a step after ${esc(steps[i].name)}"><circle cx="${mx}" cy="${my}" r="9"/><text x="${mx}" y="${my + 4}" text-anchor="middle">+</text></g>`;
  }
  if (o.edit && steps.length) { const l = pos[steps.length - 1]; plus += `<g class="gplus ${o.insertAt === steps.length - 1 ? "on" : ""}" data-wins="${steps.length - 1}" role="button" aria-label="Add a step at the end"><circle cx="${l.x + (l.r % 2 ? -70 : 70)}" cy="${l.y}" r="9"/><text x="${l.x + (l.r % 2 ? -70 : 70)}" y="${l.y + 4}" text-anchor="middle">+</text></g>`; }
  // loop back for "each AC" (above the row)
  const fi = steps.findIndex(s => s.perAc), li = steps.map(s => !!s.perAc).lastIndexOf(true);
  if (fi >= 0 && li > fi) {
    const a = pos[li], b = pos[fi], ya = a.y - NH / 2 - 2, yb = b.y - NH / 2 - 2, cy = Math.min(ya, yb) - 46;
    edges += `<path class="edge loop" d="M${a.x} ${ya} C${a.x} ${cy}, ${b.x} ${cy}, ${b.x} ${yb}" marker-end="url(#arr)"/><text class="looplbl" x="${(a.x + b.x) / 2}" y="${cy + 10}" text-anchor="middle">next AC</text>`;
  }
  // custom connections: gate "send back", branch "no" (below the row)
  steps.forEach((s, i) => {
    [[s.back, "send back"], [s.no, "no"]].forEach(([t, lbl]) => {
      const j = idx(t); if (j < 0) return;
      const a = pos[i], b = pos[j], ya = a.y + NH / 2 + 4, yb = b.y + NH / 2 + 2, cy = Math.max(ya, yb) + 44;
      edges += `<path class="edge back ${lbl === "no" ? "no" : ""}" d="M${a.x} ${ya} C${a.x} ${cy}, ${b.x} ${cy}, ${b.x} ${yb}" marker-end="url(#arr)"/><text class="looplbl backlbl" x="${(a.x + b.x) / 2}" y="${cy - 4}" text-anchor="middle">${lbl}</text>`;
    });
  });
  steps.forEach((s, i) => {
    const { x, y } = pos[i], st = state(i), sel = o.selected === s.id ? " gsel" : "";
    const wsel = o.edit ? ` data-wsel="${s.id}" role="button" tabindex="0"` : ` data-fnode="${s.id}"`;
    const title = `<title>${esc(s.name)}${s.agent ? " — " + esc(s.agent) : ""}</title>`;
    const tok = o.tokens && s.model ? `<text class="lbl2" x="${x}" y="${y + (s.lanes ? 62 : 34)}" text-anchor="middle">≈ ${kfmt(stepEstimate(s, 3).tok)}</text>` : "";
    const locked = s.lock && o.keel !== false;
    const badge = !o.edit ? "" : locked
      ? `<g class="glock" data-wdel="${s.id}" role="button" aria-label="${esc(s.name)} is a keel rule"><rect x="${x + 36}" y="${y - 31}" width="16" height="13" rx="3"/><path d="M${x + 40} ${y - 31} v-3 a4 4 0 0 1 8 0 v3"/></g>`
      : `<g class="gdel" data-wdel="${s.id}" role="button" aria-label="Remove ${esc(s.name)}"><circle cx="${x + 44}" cy="${y - 22}" r="9"/><text x="${x + 44}" y="${y - 18}" text-anchor="middle">×</text></g>`;
    if (s.lanes) {
      s.lanes.forEach(([t, sub, kind], j) => { const yy = y + (j ? 22 : -22);
        nodes += `<g class="node n-${st}${sel}"${wsel}>${title}<rect x="${x - NW / 2}" y="${yy - 17}" width="${NW}" height="34" rx="${kind === "code" ? 3 : 8}"/><text x="${x}" y="${yy - 1}" text-anchor="middle">${t}</text><text class="lbl2" x="${x}" y="${yy + 11}" text-anchor="middle">${sub}</text></g>`; });
      nodes += `<text class="looplbl" x="${x}" y="${y - 46}" text-anchor="middle">at the same time</text>${tok}${badge.replace(`y="${y - 31}"`, `y="${y - 53}"`).replace(`cy="${y - 22}"`, `cy="${y - 44}"`)}`;
      return;
    }
    if (s.kind === "gate" || s.kind === "branch") {
      const r = 22, gl = s.kind === "branch" ? "?" : "◆";
      nodes += `<g class="node n-${st}${s.kind === "branch" ? " n-branch" : ""}${sel}"${wsel}>${title}<path d="M${x} ${y - r} L${x + r + 14} ${y} L${x} ${y + r} L${x - r - 14} ${y} Z"/><text x="${x}" y="${y + 4}" text-anchor="middle">${gl} ${esc(s.name.length <= 10 ? s.name : s.name.split(" ")[0])}</text></g>${badge}`;
      return;
    }
    const ghosts = s.kind === "parallel" && s.count ? Math.min(s.count, 3) - 1 : 0;
    for (let k = ghosts; k >= 1; k--) nodes += `<rect class="ghost" x="${x - NW / 2 + k * 4}" y="${y - NH / 2 - k * 4}" width="${NW}" height="${NH}" rx="8"/>`;
    const custom = s.agent && s.agent.startsWith("★");
    nodes += `<g class="node n-${custom && st === "todo" ? "custom" : st}${sel}"${wsel}>${title}<rect x="${x - NW / 2}" y="${y - NH / 2}" width="${NW}" height="${NH}" rx="${s.kind === "code" ? 3 : 8}"/>
      <text x="${x}" y="${y + (s.agent ? -1 : 4)}" text-anchor="middle">${esc(short(s.name.replace(/ × \d+.*$/, "")))}${s.count ? ` ×${s.count}` : ""}</text>
      ${s.agent ? `<text class="lbl2" x="${x}" y="${y + 11}" text-anchor="middle">${esc(short(s.agent))}</text>` : ""}</g>${tok}${badge}`;
  });
  return `<svg class="graph ${o.edit ? "gedit" : ""}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graph of ${steps.length} steps${o.current ? ", now at " + esc(steps[cur]?.name || "") : ""}">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--faint)"/></marker></defs>
    ${edges}${nodes}${plus}</svg>`;
}

WF_TEMPLATES.feature.steps.find(s => s.id === "s2").back = "s1";
WF_TEMPLATES.feature.steps.find(s => s.id === "s9").back = "s4";

function stepsTable(w) {

function connectionsField(w, sel) {
  const i = w.steps.indexOf(sel), prev = w.steps[i - 1], next = w.steps[i + 1];
  const opts = (val, filter) => `<option value="">— none —</option>` + w.steps.filter(filter).map(s => `<option value="${s.id}" ${s.id === val ? "selected" : ""}>${esc(s.name)}</option>`).join("");
  return `<div class="field"><span class="lab">Connections</span>
    <div class="conn-mini"><span class="sub">comes after</span><b>${prev ? esc(prev.name) : "start"}</b><span class="sub">goes to</span><b>${next ? esc(next.name) : "done"}</b></div>
    ${sel.kind === "gate" ? `<label class="sub" for="wback">If you send it back, go to</label><select id="wback">${opts(sel.back, s => w.steps.indexOf(s) < i)}</select>` : ""}
    ${sel.kind === "branch" ? `<label class="sub" for="wno">If the answer is no, go to</label><select id="wno">${opts(sel.no, s => s !== sel)}</select><span class="hint">If yes, it goes on to “${next ? esc(next.name) : "done"}”.</span>` : ""}
    <div class="row"><button class="btn sm" type="button" data-wmove="${sel.id}|-1" ${i === 0 ? "disabled" : ""}>Move earlier</button><button class="btn sm" type="button" data-wmove="${sel.id}|1" ${i === w.steps.length - 1 ? "disabled" : ""}>Move later</button></div></div>`;
}
function removeStep(id) {
  const w = wf(), i = w.steps.findIndex(s => s.id === id), s = w.steps[i];
  if (!s) return;
  if (s.lock && w.keel) { wfLockAsk = id; wfRemoved = null; render(); return; }
  w.steps.splice(i, 1);
  w.steps.forEach(x => { if (x.back === id) delete x.back; if (x.no === id) delete x.no; });
  wfRemoved = { s, i, key: wfKey }; wfLockAsk = null; wfInsertAt = null;
  wfSel = (w.steps[i] || w.steps[i - 1] || {}).id; render();
}
function moveStep(id, d) {
  const w = wf(), i = w.steps.findIndex(s => s.id === id), j = i + d;
  if (j < 0 || j >= w.steps.length) return;
  const [s] = w.steps.splice(i, 1); w.steps.splice(j, 0, s); wfSel = id; render();
}

}
function closeDrawer() { $("#layer").innerHTML = ""; }

/* ---------- render + events ---------- */
const VIEWS = { map: vMap, repo: vRepo, settings: vSettings, wiki: vWiki, projects: vProjects, flow: vFlow, live: vLive, workflows: vWorkflows, agents: vAgents, skills: vSkills, stacks: vStacks, tools: vTools, jobs: vJobs, budget: vBudget, connections: vConnections };
function render() {
  nav();
  $("#main").innerHTML = VIEWS[screen]();
  if (screen === "flow") bindFlow();
  if (screen === "agents") $("#newAgent").onclick = openNewAgent;
  if (screen === "workflows") bindWorkflows();
  if (screen === "live") bindLive();
  if (screen === "skills") bindSkills();
  if (screen === "settings") bindSettings();
  if (screen === "projects") $("#startFlow").onclick = openStartFlow;
  if ($("#startFlow2")) $("#startFlow2").onclick = openStartFlow;
  if (screen === "jobs" && $("#closeJob")) $("#closeJob").onclick = () => { openJob = null; render(); };
}
document.addEventListener("click", e => {
  const mk = e.target.closest("[data-mtab],[data-ep]");
  if (mk) { if (mk.dataset.mtab) mapTab = mk.dataset.mtab; if (mk.dataset.ep) mapEp = mk.dataset.ep; render(); return; }
  const rk = e.target.closest("[data-rtab],[data-rfile]");
  if (rk) { if (rk.dataset.rtab) repoTab = rk.dataset.rtab; if (rk.dataset.rfile) repoFile = rk.dataset.rfile; render(); return; }
  const wk = e.target.closest("[data-wiki],[data-install],[data-export],[data-wfopen]");
  if (wk) { e.preventDefault();
    if (wk.dataset.wiki) { wikiPage = wk.dataset.wiki; render(); }
    if (wk.dataset.install) openInstall(wk.dataset.install);
    if (wk.dataset.export) openExport(wk.dataset.export);
    if (wk.dataset.wfopen) { wfKey = wk.dataset.wfopen; wfSel = wf().steps[0].id; wfTab = "builder"; go("workflows"); }
    return; }
  const pk = e.target.closest("[data-pick]");
  if (pk) { pickProject(pk.dataset.pick, "flow"); return; }
  const sk = e.target.closest("button[data-toast]") ? null : e.target.closest("[data-skill],[data-stack]");
  if (sk) { if (sk.dataset.skill) openSkill(sk.dataset.skill); else { stackSel = sk.dataset.stack; render(); } return; }
  const w = e.target.closest("[data-wdel],[data-wins],[data-wmove],[data-wundo],[data-wcancel],[data-wrulesoff],[data-wsel],[data-wadd],[data-wtab]");
  if (w) { const d = w.dataset;
    if (d.wdel) return removeStep(d.wdel);
    if (d.wins != null) { wfInsertAt = +d.wins; wfLockAsk = null; wfRemoved = null; render(); return; }
    if (d.wmove) { const [id, dir] = d.wmove.split("|"); return moveStep(id, +dir); }
    if (d.wundo != null && wfRemoved) { WF_TEMPLATES[wfRemoved.key].steps.splice(wfRemoved.i, 0, wfRemoved.s); wfSel = wfRemoved.s.id; wfRemoved = null; render(); return; }
    if (d.wcancel != null) { wfInsertAt = null; wfLockAsk = null; render(); return; }
    if (d.wrulesoff) { wf().keel = false; wfLockAsk = null; return removeStep(d.wrulesoff); }
    if (d.wsel) { wfSel = d.wsel; wfInsertAt = null; }
    if (d.wadd) return addStep(d.wadd);
    if (d.wtab) wfTab = d.wtab;
    render(); return; }
  const t = e.target.closest("[data-go],[data-toast],[data-close],[data-atab],[data-agent],[data-server],[data-test],[data-jtab],[data-job],[data-testp]");
  if (!t) return;
  if (t.dataset.test) { e.stopPropagation(); toast(`${t.dataset.test}: tools/list returned ${servers.find(s => s.name === t.dataset.test).tools.length} tools`); return; }
  if (t.dataset.testp) { const out = $("#t-" + t.dataset.testp); out.textContent = "sending “Reply with exactly: OK”…"; setTimeout(() => { out.innerHTML = `<b style="color:var(--ok)">OK</b> · ${(0.8 + Math.random()).toFixed(1)}s`; }, 900); return; }
  if (t.dataset.toast) toast(t.dataset.toast);
  if (t.hasAttribute("data-close")) closeDrawer();
  if (t.dataset.go) { e.preventDefault(); go(t.dataset.go); return; }
  if (t.dataset.atab) { agentTab = t.dataset.atab; render(); }
  if (t.dataset.agent) openAgent(t.dataset.agent);
  if (t.dataset.server) { openServer = openServer === t.dataset.server ? null : t.dataset.server; render(); }
  if (t.dataset.jtab) { jobsTab = t.dataset.jtab; render(); }
  if (t.dataset.job) { openJob = t.dataset.job === "h" ? "ac-reviewer" : (running.find(r => r.id === t.dataset.job) || {}).agent; render(); const d = $("#closeJob"); if (d) d.scrollIntoView({ block: "nearest" }); }
});
document.addEventListener("change", e => {
  if (e.target.name === "cp") copilotMode = e.target.value;
  if (e.target.dataset.allow) { const [a, s] = e.target.dataset.allow.split("|"); allow[a][s] = e.target.checked ? 1 : 0; toast(`${a} ${e.target.checked ? "may now use" : "can no longer use"} ${s}`); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS[h] && h !== screen) { screen = h; render(); } });
$("#theme").onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};
setInterval(() => document.querySelectorAll("[data-since]").forEach(el => el.textContent = dur(Date.now() - +el.dataset.since)), 1000);
setInterval(liveTick, 2200);
for (let i = 0; i < 3; i++) liveTick();
render();
</script>
