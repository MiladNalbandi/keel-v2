<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1420" viewBox="0 0 1150 1420"><defs><marker id="ah-6f6b63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f6b63"/></marker><marker id="ah-c0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ah-1f8a4c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a4c"/></marker><marker id="ah-c27c00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c27c00"/></marker><marker id="ah-7a5cff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5cff"/></marker></defs><rect width="100%" height="100%" fill="#faf9f5"/><text x="40" y="52" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#131314" text-anchor="start">keel v2 · the acceptance-criteria loop</text><text x="40" y="82" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4a463f" text-anchor="start">One round for each criterion (AC-1, AC-2, …), in order. Test first, then code, then your gate.</text><rect x="330" y="120" width="470" height="52" rx="12" fill="#f1efea" stroke="#9b968c" stroke-width="1.8"/><text x="346" y="148" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#131314" text-anchor="start">Criterion AC-n starts</text><line x1="565.0" y1="172" x2="565.0" y2="200" stroke="#6f6b63" stroke-width="2" marker-end="url(#ah-6f6b63)"/><rect x="330" y="200" width="470" height="96" rx="12" fill="#efe9ff" stroke="#7a5cff" stroke-width="1.8"/><text x="346" y="222" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#4b2fd1" text-anchor="start">AGENT · test-author</text><text x="346" y="244" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#131314" text-anchor="start">RED · write a failing test</text><text x="346" y="266" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a463f" text-anchor="start">for this criterion only, no production code;</text><text x="346" y="285" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a463f" text-anchor="start">it never sees the implementation plan</text><line x1="565.0" y1="296" x2="565.0" y2="324" stroke="#6f6b63" stroke-width="2" marker-end="url(#ah-6f6b63)"/><rect x="330" y="320" width="470" height="96" rx="12" fill="#e6f1fb" stroke="#0b74c4" stroke-width="1.8"/><text x="346" y="342" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0b5a99" text-anchor="start">KEEL</text><text x="346" y="364" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#131314" text-anchor="start">verify_red</text><text x="346" y="386" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a463f" text-anchor="start">keel runs the test: it must FAIL for the right</text><text x="346" y="405" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a463f" text-anchor="start">reason · then keel commits test(AC-n)</text><line x1="565.0" y1="416" x2="565.0" y2="444" stroke="#1f8a4c" stroke-width="2" marker-end="url(#ah-1f8a4c)"/><text x="573.0" y="436" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f8a4c" text-anchor="start">fails as it should</text><rect x="330" y="440" width="470" height="96" rx="12" fill="#efe9ff" stroke="#7a5cff" stroke-width="1.8"/><text x="346" y="462" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#4b2fd1" text-anchor="start">AGENT · implementer</text><text x="346" y="484" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#131314" text-anchor="start">GREEN · the smallest code that passes</text><text x="346" y="506" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a463f" text-anchor="start">only what this test needs; tests are frozen</text><text x="346" y="525" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a463f" text-anchor="start">in this phase (the guard refuses edits)</text><line x1="565.0" y1="536" x2="565.0" y2="564" stroke="#6f6b63" stroke-width="2" marker-end="url(#ah-6f6b63)"/><rect x="330" y="560" width="470" height="96" rx="12" fill="#e6f1fb" stroke="#0b74c4" stroke-width="1.8"/><text x="346" y="582" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0b5a99" text-anchor="start">KEEL</text><text x="346" y="604" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#131314" text-anchor="start">verify_green</text><text x="346" y="626" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a463f" text-anchor="start">keel runs the tests: they must PASS</text><text x="346" y="645" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a463f" text-anchor="start">· then keel commits feat(AC-n)</text><line x1="565.0" y1="656" x2="565.0" y2="684" stroke="#1f8a4c" stroke-width="2" marker-end="url(#ah-1f8a4c)"/><text x="573.0" y="676" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f8a4c" text-anchor="start">green</text><rect x="330" y="680" width="470" height="96" rx="12" fill="#efe9ff" stroke="#7a5cff" stroke-width="1.8"/><text x="346" y="702" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#4b2fd1" text-anchor="start">AGENT · ac-reviewer</text><text x="346" y="724" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#131314" text-anchor="start">AC review</text><text x="346" y="746" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a463f" text-anchor="start">a fresh reviewer reads RED + GREEN: is the</text><text x="346" y="765" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a463f" text-anchor="start">criterion met, does the test prove it?</text><line x1="565.0" y1="776" x2="565.0" y2="804" stroke="#6f6b63" stroke-width="2" marker-end="url(#ah-6f6b63)"/><rect x="330" y="800" width="470" height="96" rx="22" fill="#fff2db" stroke="#c27c00" stroke-width="2.4"/><path d="M350,848.0 l10,-10 l10,10 l-10,10 z" fill="#c27c00"/><text x="380" y="822" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#8a5600" text-anchor="start">YOU · GATE</text><text x="380" y="844" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#131314" text-anchor="start">AC gate · you decide</text><text x="380" y="866" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a463f" text-anchor="start">commits, test results and the review are on the</text><text x="380" y="885" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a463f" text-anchor="start">card (Flow page, Inbox, phone notification)</text><line x1="565.0" y1="896" x2="565.0" y2="950" stroke="#1f8a4c" stroke-width="2.4" marker-end="url(#ah-1f8a4c)"/><text x="575.0" y="928" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f8a4c" text-anchor="start">approve</text><rect x="330" y="950" width="470" height="74" rx="12" fill="#f1efea" stroke="#9b968c" stroke-width="1.8"/><text x="346" y="978" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#131314" text-anchor="start">Next criterion: AC-n+1 · round again</text><text x="346" y="1016" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a463f" text-anchor="start">after the last one: integration, then ship</text><path d="M330,987 C294,987 294,146 330,146" fill="none" stroke="#1f8a4c" stroke-width="2.2" marker-end="url(#ah-1f8a4c)"/><text x="296" y="910" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f8a4c" text-anchor="end">next AC</text><path d="M800,848 C1050,848 1050,248 800,248" fill="none" stroke="#c0392b" stroke-width="2.6" marker-end="url(#ah-c0392b)"/><text x="1000" y="538.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#c0392b" text-anchor="start">send back</text><text x="1000" y="556.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c0392b" text-anchor="start">with your note:</text><text x="1000" y="573.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c0392b" text-anchor="start">a new RED round</text><path d="M800,600 C856,600 856,496 800,496" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#ah-c0392b)"/><text x="856" y="554" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="start">still red:</text><text x="856" y="571" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="start">GREEN again</text><text x="856" y="588" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c0392b" text-anchor="start">(3 tries, then</text><text x="856" y="605" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c0392b" text-anchor="start">keel asks you)</text><rect x="24" y="300" width="250" height="176" rx="22" fill="#fff2db" stroke="#c27c00" stroke-width="2.4"/><path d="M44,388.0 l10,-10 l10,10 l-10,10 z" fill="#c27c00"/><text x="74" y="322" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#8a5600" text-anchor="start">YOU · GATE</text><text x="74" y="344" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#131314" text-anchor="start">Already met?</text><text x="74" y="366" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a463f" text-anchor="start">the test passed before</text><text x="74" y="385" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a463f" text-anchor="start">any code was written</text><text x="74" y="404" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a463f" text-anchor="start">approve: AC done, test kept</text><text x="74" y="423" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4a463f" text-anchor="start">send back: a stricter test</text><line x1="330" y1="368" x2="276" y2="368" stroke="#c27c00" stroke-width="2" marker-end="url(#ah-c27c00)"/><rect x="40" y="1060" width="920" height="210" rx="12" fill="#ffffff" stroke="#e3e0d9"/><text x="60" y="1092" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#131314" text-anchor="start">Good to know</text><text x="60" y="1122" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3d3a35" text-anchor="start">• The spec needs a change? RED or GREEN can stop for a spec amendment: you approve it at its own gate, then RED again.</text><text x="60" y="1146" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3d3a35" text-anchor="start">• Each agent starts fresh: the test author never sees the plan; the reviewer sees only the diff and the criterion.</text><text x="60" y="1170" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3d3a35" text-anchor="start">• keel&#x27;s guard checks every file an agent writes: in RED only tests may change, in GREEN tests stay frozen.</text><text x="60" y="1194" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3d3a35" text-anchor="start">• Gate mode &quot;end&quot; skips this gate (one review at the end). Run mode &quot;important&quot; or &quot;auto&quot; can approve a clean</text><text x="60" y="1218" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3d3a35" text-anchor="start">  gate by itself (checks green, review clean); it is logged and listed in the final review and the PR.</text><text x="60" y="1242" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3d3a35" text-anchor="start">• At a waiting gate the Helper can fix things for you (Fix mode); Done runs the checks and keel commits.</text><rect x="40" y="1310" width="22" height="16" rx="4" fill="#efe9ff" stroke="#7a5cff" stroke-width="1.8"/><text x="70" y="1323" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d3a35" text-anchor="start">an agent works (its own fresh context)</text><rect x="340" y="1310" width="22" height="16" rx="4" fill="#e6f1fb" stroke="#0b74c4" stroke-width="1.8"/><text x="370" y="1323" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d3a35" text-anchor="start">keel itself: runs tests, commits</text><rect x="640" y="1310" width="22" height="16" rx="8" fill="#fff2db" stroke="#c27c00" stroke-width="1.8"/><text x="670" y="1323" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d3a35" text-anchor="start">a gate: you decide</text><line x1="40" y1="1346" x2="80" y2="1346" stroke="#c0392b" stroke-width="2.4"/><text x="88" y="1351" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d3a35" text-anchor="start">a way back (send back, a failing check)</text><line x1="400" y1="1346" x2="440" y2="1346" stroke="#1f8a4c" stroke-width="2.4"/><text x="448" y="1351" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d3a35" text-anchor="start">approve / pass: go on</text></svg>