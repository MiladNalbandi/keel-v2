# Stack pack: TypeScript + React frontend.
name: ts-react
lane: web
# Which `skills/architecture/references/<style>-<suffix>.md` file this stack reads.
arch_ref_suffix: web

detect:
  # `package.json` alone used to be enough to match — every JS project has one, TypeScript or
  # not, and once react-js existed that stopped being a TypeScript signal at all.
  files: [tsconfig.json]
  extensions: ['.ts', '.tsx']

layers:
  - id: component
    what: rendering, form validation, error and empty states
    where: src/**/*.test.tsx
  - id: hook
    what: state transitions and data fetching, with MSW
    where: src/**/*.test.ts

commands:
  web_typecheck: 'npx tsc --noEmit'
  web_test_ac: 'npx vitest run -t {AC}'
  web_test_module: 'npx vitest run'
  web_test_paths: 'npx vitest run {PATHS}'
  coverage_web: 'npx vitest run --coverage'
  static_checks: 'npx --no-install eslint . && npx --no-install tsc --noEmit'

coverage_report: coverage/lcov.info

# Programs keel runs for this stack, in frontend.dir (runtime/tools.py). `npx --no-install` never downloads: a project
# without the package gets "not available", not a surprise install. A tool that changes files is a fixer (fail: fix).
tools:
  eslint-fix:
    run: 'npx --no-install eslint --fix {FILES}'
    on: edit
    match: '\.(ts|tsx|js|jsx)$'
    # It fixes what it can; what it cannot is one line to the next agent.
    fail: fix
    timeout: 120
    description: 'Fix the lint problems eslint can fix in the files an agent just changed'
  prettier:
    run: 'npx --no-install prettier --write {FILES}'
    on: edit
    match: '\.(ts|tsx|js|jsx|css|scss|json)$'
    fail: fix
    timeout: 60
    description: 'Format the files an agent just changed'
  tsc:
    run: 'npx --no-install tsc --noEmit'
    on: pre-commit
    match: '\.(ts|tsx)$'
    fail: block
    timeout: 300
    description: 'Refuse a commit that does not type-check'
  eslint:
    run: 'npx --no-install eslint .'
    on: manual
    fail: block
    timeout: 300
    description: 'Lint the whole frontend'

# See kotlin-spring.yml's starter block for how `from:` and `to:` are resolved.
starter:
  - from: ../templates/starter/vitest.config.ts
    to: '{FRONTEND}/vitest.config.ts'

# Same keys as every other pack's devcontainer block, so a generator can merge them without
# knowing which stack it is looking at. `primary: false` means this pack does not supply the
# Dockerfile's FROM — when it is matched alongside a primary pack it contributes its
# `toolchain_install` lines to that base image instead.
devcontainer:
  primary: false
  image: mcr.microsoft.com/devcontainers/typescript-node:20
  # Adds Node to someone else's base image; one `run:` becomes one Dockerfile RUN, as root.
  # Written as `run:` maps rather than bare strings because a bare list item containing a
  # colon — any URL — is read as a map by keel's YAML reader. Here the URL sits in the
  # value, where its colons survive.
  toolchain_install:
    - run: curl -fsSL https://deb.nodesource.com/setup_20.x | bash - && apt-get install -y --no-install-recommends nodejs && rm -rf /var/lib/apt/lists/*
  volumes:
    - name: npm-cache
      at: /root/.npm
  ports:
    - host: 5173
      container: 5173
  env:
    # Vite binds to localhost by default, which is unreachable from outside the container.
    VITE_HOST: 0.0.0.0

skills:
  testing: web-testing
  implementation: web-implementation
  architecture: architecture
architecture_styles: [feature-sliced, layered]

boundary_defaults:
  feature-sliced:
    - name: feature-isolation
      from: '{DIR}/src/features/*/**'
      deny_imports: ['@/features/**']
      allow_imports: ['@/shared/**', '@/entities/**']
  layered:
    - name: no-component-imports-page
      from: '{DIR}/src/components/**'
      deny_imports: ['@/pages/**', '@/routes/**']
