# The sets a core-only keel offers on its welcome ("Start with a set", docs/plugins/13-step4-contract.md §9).
# The engine lists them (GET /marketplace/sets) with the plugins keel does not have yet (installed from the
# marketplace) and the ones it has but are off (turned on). Plugin names, in the order they are shown.
sets:
  - id: developer
    title: Developer
    summary: Read and change code with agents.
    plugins: [code, git, review, db, ci, graph, keelbot]
  - id: review
    title: Review
    summary: Review pull requests in keel.
    plugins: [code, git, review, keelbot]
  - id: knowledge
    title: Knowledge
    summary: Help agents know the project.
    plugins: [wiki, map, graph]
  - id: tickets
    title: Tickets
    summary: Start flows from your issues.
    plugins: [tasks, jira, github-issues]
