id: feature
name: feature (keel)
keel_rules: true
version: 2
# The spec flow, ported from keel v1 skills/feature. Preflight and the flow's own branch; 0.18.21 web research when the
# feature depends on outside docs (web_check: an explorer answers WEB: yes | no; web_docs: the web-researcher, only on
# yes; the spec cites what it confirmed and turns the rest into open questions); the interview (0.18.21: one question
# per open lens as buttons on the interview gate, before the spec) and the spec from keel's spec template with its
# numbered criteria; only then one explorer per area (api, web, data) and
# the plan under the criteria; the spec gate (approve freezes and commits the spec; edit, rewrite, review, order and
# reject come back to it); the contract (codegen and the fast check before its gate, which lists each endpoint as new,
# changed or breaking callers) and its gate; the test-first loop per criterion (red, green, an optional refactor with
# the tests frozen), where an agent that finds the frozen spec wrong stops with AMEND and the spec gets a dated
# amendment with its own gate; integration and its gate; security (auditor + dependency triager, shown only when they
# report something); the full-diff review (2 rounds); the stack up and migrated (when configured); smoke, then e2e
# (asks when no e2e command is set), with their gates; "ready to ship?" (ship / diff / wrong -> an amendment / stop,
# with the criteria, the full-diff review, security and e2e/smoke in front); ship (its steps are included, ids ship_*);
# an ADR when a decision had a real alternative; close.
# Inputs (StartThread.data / a start_flow seed): acs (inline criteria from change; finished ones stay finished, no
# interview), evidence (fix, diagnose: added to the request), needs_e2e (hunt), no_gates (waives the optional gates).
# Deferred: lanes in their own worktrees, spike mode.
steps:
  - { id: preflight, kind: code, name: preflight + own branch, action: preflight, phase: preflight }
  # 0.18.21 does the spec need facts from outside the repository? keep: data.web_check_text (what it needs)
  - id: web_check
    kind: agent
    name: outside docs needed?
    agent: explorer
    model: default
    phase: spec
    keep: true
    markers: [WEB]
    instructions: >-
      Do not write the spec and do not ask questions: decide only whether the spec needs facts from outside this
      repository. Read the request and grep the code it touches (a few files, edit nothing). WEB is yes when the request
      or that code depends on a third-party API, webhook, library or standard (a protocol, a file format) whose details
      the criteria need (field names, payload formats, enum values, versions, limits, auth) and the repository does not
      hold them (no client, DTO, fixture, recorded payload or vendored doc settles them). WEB is no for work inside this
      code (a refactor, a rename, a page, a rule on data the repository already has), and when the request already
      carries web research with source URLs (a spike's findings). On yes, list the exact outside facts the criteria
      need, one per line, with the vendor or library and what the repository already shows (file:line). At most 15
      lines. End with exactly one line: WEB: yes, or WEB: no.
  - id: web_docs
    kind: agent
    name: research the outside docs
    agent: web-researcher
    model: default
    phase: spec
    keep: true
    markers: [CONFIDENCE]
    when: { marker: WEB, equals: "yes", step: web_check }
    instructions: >-
      Research what this feature's spec needs from outside the repository: the third-party APIs, webhooks, libraries or
      standards the request depends on (field names, payload formats, versions, limits). Search first, then fetch the
      best sources; never conclude from one failed URL. Edit nothing. What the spec needs from outside, as the explorer
      found it:

      {{data.web_check_text}}
  # 0.18.21 keel v1's interview: the person answers what the request, the code and the evidence leave open, before the
  # spec is written (skipped when criteria are handed over; the gate pauses only when there are questions)
  - id: interview
    kind: agent
    name: interview
    agent: explorer
    model: default
    phase: spec
    asks: true
    keep: true
    when: { state: acs, absent: true }
    instructions: >-
      Interview the person before the spec is written; write no file. Read the request, the evidence handed over (if
      any), keel's memory of the project and only the code the request names. Go through these lenses: goal and users
      (who gains what; what "user" means), scope (what is in, what is out), edge cases (absent, empty, malformed,
      duplicate, limit, a later update, an old message still queued), validation and errors (what is refused, what
      the caller sees), security (who may read and change what, what must never be logged), data (new fields,
      migration, existing rows, message contracts), UX (empty, loading and error states), performance (a number, or
      none), rollout (deploy order between producer and consumer, old clients, feature flag), out of scope. Skip a
      lens the request, the code or the evidence already answers, or that does not apply. For each lens still open
      whose answer would change the criteria, ask one question: at most 6, most important first, each with 2 to 4
      options (the recommended one first, "recommended": true, each saying what it costs), ending your answer with
      one ```keel-questions block (a JSON list of {"id", "question", "why", "options": [{"label", "description",
      "recommended"}]}; the person can also answer in their own words). When nothing is open, ask nothing and end
      with "NO_QUESTIONS: <why, in one line>". Always write first, in a short list, what each lens already says and
      where (request, file:line, URL). When the answers come back, write that list again with each answer in it.
      The web research on the outside docs this feature depends on ("(nothing yet)" when it did not need any): do not
      ask what it confirmed; ask about what it could not confirm when that would change the criteria.

      {{data.web_docs_text}}
  - { id: interview_gate, kind: gate, name: your answers, phase: spec, when: { state: clarify.questions } }
  - id: spec
    kind: agent
    name: spec
    agent: explorer
    model: default
    phase: spec
    tools: ["mcp:keel:*"]
    instructions: >-
      Interview first, criteria second, code last: write the criteria from what was asked, not from the code that
      exists. Use keel's spec template (its path and sections are above). It starts with the six sections a reader
      scans first: In plain words (5 to 10 short sentences for a colleague who does not know the code: what is wrong
      or missing, what we will do, what a user will notice, what stays the same, what we still need to find out;
      simple English, no file names or jargon, one everyday example), For engineers (8 to 15 precise lines: the change
      at each layer, inbound, parsing, the message contract, the handler, persistence, outbound, with the classes and
      tables named; the design choices and why: idempotency, ordering, null semantics, transaction scope;
      compatibility: rolling deploy, old messages, old clients; where it can fail and how we see it: logs, metrics),
      What will change (one line per file or area: new, changed or removed), Payload changes (JSON before and after,
      each field marked // + // ~ // -, the compatibility note; or "none: <the reason>"), Database changes (the table
      before and after with types, nullability and indexes marked + ~ -, the migration's name with its up and down SQL,
      online or locking on this database with the row count when known, any backfill and its cost, the deploy order
      migration then consumer then producer, the rollback and the data it loses, the repository or query methods that
      change; or "none: <the reason>"), Architecture (an ASCII request path inbound → app → domain → persistence →
      outbound, each box marked new, changed or unchanged, and one line on why it fits the layers). Then a Goal, User stories ("As a <role>, I want
      <capability>, so that <benefit>"), Findings (evidence) with a file:line or URL behind every claim and the paths
      the change touches traced (inbound, internal messages and their contract, persistence, outbound) with the tests
      that exist today, criteria "AC-n [API|WEB|E2E|SMOKE] Given, when, then" that cover absent, valid, malformed, a later
      update, an old message still queued and the docs, Test layers for every criterion, Validation and security
      rules, Edge cases, Risks and cost (files, migration, rolling deploy order, ambiguities to decide), Unverified and
      open questions for anything no source confirms, Out of scope, and a Definition of done. Draw before you finish
      the list: a UI mockup with four states (default, empty, loading, error) for any [WEB] criterion, a request path
      (each hop marked + new or ~ changed) for any [API] one; a schema change gets its own migration notes. Tag a
      journey that needs a browser [E2E] and a check that must also pass after a deploy [SMOKE]. Each interview answer
      becomes a sentence under Decisions; do not ask what the interview answered. When the criteria are listed above
      already (handed over by a change flow), do not ask questions: write the spec around them, keep their ids and
      words, and leave the finished ones finished.
      Outside docs (0.18.21): the web research below is what was confirmed about the third-party APIs, webhooks or
      libraries this feature depends on ("(nothing yet)" when it did not need any). A criterion about outside data names
      only what the research confirms and cites its URL. Do not invent a field name, format or limit it did not confirm:
      write each such detail under the spec's "## Unverified and open questions", with what a person must
      supply to settle it (a sample payload, a sandbox account, a docs page). The web research:

      {{data.web_docs_text}}

      The interview (what each lens already says):

      {{data.interview_text}}

      The person's answers:

      {{data.interview_answers}}
  - { id: explore_areas, kind: code, name: areas to map, action: explore_areas, phase: spec, when: { state: acs } }
  - id: explore
    kind: parallel
    name: one explorer per area
    agent: explorer
    model: default
    from: explore_areas
    phase: spec
    when: { state: acs }
    instructions: >-
      The criteria are settled. Map your area for the criteria in your item: the files each one touches, the pattern
      to copy (file:line), the test layer and where similar tests live (say so when none do), and the exposures this
      work inherits (concurrency, idempotency, authorization, data shape). Read only, at most 60 lines, no opinion on
      architecture, no code. End with MAP-END.
  - { id: maps, kind: code, name: collect the maps, action: report, phase: spec, when: { state: acs } }
  - id: plan
    kind: agent
    name: plan under the criteria
    agent: explorer
    model: default
    phase: spec
    markers: [ORDER, CONTRACT-DELTA]
    when: { state: acs }
    instructions: >-
      Append a "## Plan" section to the spec (replace the one that is there): the AC order (dependencies first: the
      criterion that creates a row before the one that reads it), the files per criterion from the maps below, the
      contract delta (or "none"), and the test layer per criterion (the lowest that can express it). An exposure the
      maps found that no criterion covers becomes a new criterion now, numbered after the last one. Do not change the
      other criteria. Under the plan, one line per criterion that needs another one built first:
      "- AC-n depends on: AC-x, AC-y". ORDER lists the criteria ids in build order. End with CONTRACT-DELTA: yes, or
      CONTRACT-DELTA: none when the plan's contract delta is none. The explorers' maps:

      {{data.report}}
  - { id: spec_sync, kind: code, name: criteria + plan for the gate, action: spec_sync, phase: spec }
  - id: spec_gate
    kind: gate
    name: spec approval
    back: spec
    lock: true
    phase: spec
    choices: { approve: freeze, edit: spec_edit, rewrite: spec_edit, review: spec_review, order: plan, reject: spec_restart }
    menus: true
  - { id: freeze, kind: code, name: freeze + commit the spec, action: spec_freeze, back: spec, lock: true, phase: spec }
  - { id: options, kind: gate, name: which optional phases run, phase: spec, skip_menu: true }
  - { id: contract, kind: agent, name: contract, agent: contract-author, model: default, phase: contract, when: { data: contract, equals: "yes" } }
  # keel v1 phase 2: regenerate both sides and run the fast check before the gate (a failure goes back to the contract)
  - { id: contract_check, kind: code, name: codegen + fast check, action: contract_check, phase: contract, rounds: 2, when: { data: contract, equals: "yes" } }
  - { id: contract_diff, kind: code, name: "the contract delta: new, changed, breaks callers", action: show_diff, phase: contract, when: { data: contract, equals: "yes" } }
  - id: contract_gate
    kind: gate
    name: contract delta
    lock: true
    phase: contract
    when: { data: contract, equals: "yes" }
    choices: { approve: contract_commit, change: contract, amend: contract_undo }
  - { id: contract_commit, kind: code, name: commit contract, action: commit, phase: contract, when: { data: contract, equals: "yes" } }
  - id: red
    kind: agent
    name: red
    agent: test-author
    model: default
    phase: red
    per_ac: true
    tools: ["mcp:keel:*"]
    markers: [AMEND, BLOCKED]
    instructions: >-
      If the frozen spec is wrong for this criterion (it cannot be true, it contradicts what the code shows, or a
      criterion is missing), do not work around it: stop and end your answer with one line AMEND: <what the spec
      says, what the code shows, what should change>. If you cannot go on for another reason (the test command or
      the build does not work, or another criterion must be built first), end with one line BLOCKED: <tooling, or
      needs AC-x>: <what>. Otherwise do not write those lines.
  - { id: red_amend, kind: branch, name: the spec needs an amendment, when: { marker: AMEND, step: red }, no: red_blocked, per_ac: true, phase: red }
  - { id: red_to_amend, kind: code, name: to the amendment, action: amend_start, then: amend_entry, per_ac: true, phase: red }
  - { id: red_blocked, kind: branch, name: "is the agent blocked?", when: { marker: BLOCKED, step: red }, no: verify_red, per_ac: true, phase: red }
  - { id: red_stuck, kind: code, name: blocked, action: stuck, then: red, per_ac: true, phase: red }
  - { id: verify_red, kind: code, name: verify_red, action: verify_red+commit, phase: red, per_ac: true, lock: true }
  - id: green
    kind: agent
    name: green
    agent: implementer
    model: default
    phase: green
    per_ac: true
    tools: ["mcp:keel:*"]
    markers: [AMEND, BLOCKED]
    instructions: >-
      If the frozen spec turns out to be wrong for this criterion, do not build around it: stop and end your answer
      with one line AMEND: <what the spec says, what the code shows, what should change>. If you cannot go on for
      another reason (the test command or the build does not work, or another criterion must be built first), end
      with one line BLOCKED: <tooling, or needs AC-x>: <what>. Otherwise do not write those lines.
  - { id: green_amend, kind: branch, name: the spec needs an amendment, when: { marker: AMEND, step: green }, no: green_blocked, per_ac: true, phase: green }
  - { id: green_to_amend, kind: code, name: to the amendment, action: amend_start, then: amend_entry, per_ac: true, phase: green }
  - { id: green_blocked, kind: branch, name: "is the agent blocked?", when: { marker: BLOCKED, step: green }, no: verify_green, per_ac: true, phase: green }
  - { id: green_stuck, kind: code, name: blocked, action: stuck, then: red, per_ac: true, phase: green }
  - { id: verify_green, kind: code, name: verify_green + commit, action: verify_green+commit, phase: green, per_ac: true, lock: true }
  # keel v1 REFACTOR: optional, tests frozen (the refactor phase refuses test edits), its own refactor commit
  - id: refactor
    kind: agent
    name: refactor (tests frozen)
    agent: implementer
    model: default
    phase: refactor
    per_ac: true
    markers: [REFACTOR]
    skippable: optional
    instructions: >-
      This criterion is green. Tidy only the code GREEN just wrote for it and the code it touched: duplication GREEN
      built up, a name that no longer says what it does, a long function that hides its steps, dead code it left.
      Behaviour stays exactly the same: the tests are frozen (you cannot edit them) and must stay green. No new
      behaviour, no new public surface, nothing outside this criterion's code. When nothing is worth tidying, change
      nothing. End with exactly one line: REFACTOR: done, or REFACTOR: none.
  - { id: refactor_commit, kind: code, name: verify + refactor commit, action: verify_green+commit, phase: refactor, per_ac: true,
      when: { marker: REFACTOR, equals: done, step: refactor }, skippable: optional, group: refactor }
  # 0.18.28 the tests outside this criterion's own filter (checks.after_green: none | changed | suite; default changed,
  # with the whole suite every checks.suite_every criteria and at each lane's end); a failure goes back to green
  - { id: ac_suite, kind: code, name: the tests outside this criterion, action: verify_after_green, back: green, phase: green, per_ac: true }
  - { id: ac_review, kind: agent, name: AC review, agent: criterion-reviewer, model: default, phase: gate, per_ac: true }
  - { id: ac_gate, kind: gate, name: AC gate, back: red, lock: true, phase: gate, per_ac: true }
  - id: integration
    kind: agent
    name: integration
    agent: implementer
    model: default
    phase: integration
    instructions: >-
      Every criterion is green. Wire the real client to the real API where the criteria's code still uses a stand-in
      (wiring, not new behaviour; tests are frozen). New behaviour here is a missed criterion: do not write it, say
      which criterion is missing. When nothing needs wiring, change nothing and say so.
  - { id: integration_commit, kind: code, name: verify the suite + commit, action: verify_green+commit, phase: integration }
  - { id: integration_diff, kind: code, name: the diff for the integration gate, action: show_diff, phase: integration }
  - { id: integration_gate, kind: gate, name: integration, back: integration, phase: integration, skippable: optional }
  - { id: security_deps, kind: code, name: verify deps, action: verify_deps, soft: true, phase: security, skippable: optional, group: security }
  - { id: security_scope, kind: code, name: what security reads, action: security_scope, phase: security, skippable: optional, group: security }
  - id: security
    kind: parallel
    name: security auditor + dependency triager
    agent: security-auditor
    model: default
    from: security_items
    phase: security
    redo: security_deps
    skippable: optional
    group: security
    instructions: >-
      The audit reads the branch diff in your item against the spec's authorization, validation and data rules. The
      dependency triage judges each advisory in your item: is it reachable from this code? Report findings only.
  - { id: review_fix, kind: agent, name: fix the full-diff review's findings, agent: implementer, model: default, phase: review-fix, retry_only: true }
  - { id: review_fix_commit, kind: code, name: verify the suite + commit the fix, action: verify_green+commit, phase: review-fix }
  - id: code_review
    kind: agent
    name: full-diff review
    agent: branch-reviewer
    model: default
    phase: gate
    back: review_fix
    rounds: 2
    instructions: >-
      Read the spec's criteria and scope, then the whole branch diff against the base branch. Go through your whole
      checklist: correctness across criteria, shared config keys, parameters and routes against the old version, each
      public type against its contract, a consumer's upgrade, runtime deprecations, the project's CI config (name its
      commands). Never edit; run only the project's read-only checks. End with a "What I did not check" list.
  # its verdict and sha: ship drops its correctness lens when this passed and no production file changed since
  - { id: full_review, kind: code, name: the full-diff review's verdict, action: full_review, phase: gate }
  # keel v1 phase 5: the stack up and migrated before smoke and e2e (when the project configures them); soft
  - { id: stack_up, kind: code, name: stack up + migrate, action: stack_up, phase: smoke, soft: true }
  # keel v1: smoke before e2e, the cheap check first (a broken stack shows in seconds, not inside a long e2e run)
  - { id: smoke_scope, kind: code, name: smoke checks, action: smoke_scope, phase: smoke, skippable: optional, group: smoke }
  - { id: smoke_needed, kind: branch, name: smoke checks, when: { marker: SMOKE, equals: "yes", step: smoke_scope }, no: e2e_scope, phase: smoke, skippable: optional, group: smoke }
  - id: smoke
    kind: agent
    name: smoke
    agent: e2e-author
    model: default
    phase: smoke
    skippable: optional
    group: smoke
    instructions: >-
      This step writes the smoke checks, not E2E specs: smoke/<feature>.sh (portable bash against BASE_URL and
      API_URL: health, one critical write, the read of what it wrote) and one @smoke test for the most critical path.
      Every check seeds its own data, is safe against a deployed environment and runs in under 60 seconds. The checks:

      {{data.smoke.checks}}
  - { id: smoke_commit, kind: code, name: run smoke + commit, action: verify_smoke+commit, phase: smoke, rounds: 2, skippable: optional, group: smoke }
  - { id: smoke_gate, kind: gate, name: smoke, back: smoke, phase: smoke, skippable: optional, group: smoke }
  # a project with no UI and no HTTP layer (a library): every e2e-phase step is skipped with a note (compiler._skipped)
  - { id: e2e_scope, kind: code, name: e2e criteria + tool, action: e2e_scope, phase: e2e, skippable: optional, group: e2e }
  - { id: e2e_needed, kind: branch, name: e2e criteria, when: { marker: E2E, equals: "yes", step: e2e_scope }, no: ready_show, phase: e2e, skippable: optional, group: e2e }
  - id: e2e_tool
    kind: gate
    name: no e2e command
    phase: e2e
    when: { marker: TOOL, equals: "no", step: e2e_scope }
    choices: { write: e2e_unrun, check: e2e_scope }
    skippable: optional
    group: e2e
  - id: e2e
    kind: agent
    name: e2e
    agent: e2e-author
    model: default
    phase: e2e
    markers: [E2E-RESULT]
    skippable: optional
    group: e2e
    instructions: >-
      Write one end-to-end test per criterion below, the criterion id in its title, tagged @e2e. Only the e2e folder
      is writable: a test that needs a UI change to be testable is a [WEB] criterion; stop and say so.
      {{data.e2e.note}} The criteria:

      {{data.e2e.criteria}}
  - { id: e2e_commit, kind: code, name: verify e2e + commit, action: verify_e2e+commit, phase: e2e, rounds: 2, skippable: optional, group: e2e }
  - { id: e2e_gate, kind: gate, name: e2e, back: e2e, phase: e2e, skippable: optional, group: e2e }
  # keel v1 phase 8: ask before ship, with the state in front (ship runs without stopping until its final review)
  - { id: ready_show, kind: code, name: the state before ship, action: ship_ready, phase: ship }
  - id: ready_gate
    kind: gate
    name: ready to ship?
    lock: true
    phase: ship
    choices: { ship: ship_plan, diff: ready_diff, wrong: ready_amend, stop: ready_stop }
  - { id: ship, kind: include, name: ship, flow: ship }
  - id: adr
    kind: agent
    name: ADR
    agent: explorer
    model: default
    phase: close
    instructions: >-
      Write an ADR under docs/adr/NNNN-<title>.md (the next number) only for a decision this feature made that had a
      real alternative: Context (three sentences), Decision (present tense), Alternatives (and why they lost),
      Consequences (what gets easy, what gets hard). One per such decision. If nothing had a real alternative, write
      nothing and say so: an ADR that records the obvious approach is noise.
  - { id: adr_commit, kind: code, name: commit the ADR, action: commit, phase: close }
  - { id: close, kind: code, name: close, action: close_flow, then: end, phase: close }
  # Side paths, reached only by a gate choice or a jump.
  - id: spec_edit
    kind: agent
    name: edit the spec
    agent: explorer
    model: default
    phase: spec
    instructions: >-
      At the spec gate the user chose "{{data.spec_gate_answer.choice}}". edit: change only the criteria the note
      names (keep the ids of the others). rewrite: rewrite only the section the note names. Leave everything else as
      it is. The note: {{data.spec_gate_answer.why}}
  - { id: spec_edit_sync, kind: code, name: criteria + plan for the gate, action: spec_sync, then: spec_gate, phase: spec }
  - id: spec_review
    kind: agent
    name: review the spec before approving
    agent: lens-reviewer
    model: default
    phase: review
    instructions: >-
      An adversarial read of the spec before it is approved (not of any code): criteria that are vague, untestable
      from outside, overlapping, or missing (an empty state, an error, an authorization rule, a limit); drawings that
      disagree with the criteria; a plan whose order breaks a dependency; a field name, format or limit of an outside
      API that the web research did not confirm (0.18.21: it belongs under Open questions). Do not edit anything.
      Spec: {{spec}}

      The web research: {{data.web_docs_text}}
  - { id: spec_review_sync, kind: code, name: criteria + plan + the review for the gate, action: spec_sync, then: spec_gate, phase: spec }
  - { id: spec_restart, kind: code, name: the interview starts again, action: spec_restart, then: spec, phase: spec }
  - { id: contract_undo, kind: code, name: put the contract draft back, action: reset+amend_start, then: amend, phase: contract }
  # v0.17.4 the amendment loop guard: the same criterion back after an amendment that changed nothing is asked, not looped
  - { id: amend_entry, kind: branch, name: "the same question again?", when: { data: amend.route, equals: ask }, no: amend, phase: spec }
  - id: amend_loop
    kind: gate
    name: the amendment changed nothing
    lock: true
    phase: spec
    choices: { first: amend_first, skip: amend_skip, edit: amend_edit, stop: amend_stop }
  - { id: amend_first, kind: code, name: build the other criterion first, action: amend_reorder, then: red, phase: spec }
  - { id: amend_skip, kind: code, name: move the criterion to the end, action: amend_reorder, then: red, phase: spec }
  - { id: amend_edit, kind: code, name: the amendment again with your note, action: amend_with_note, then: amend, phase: spec }
  - { id: amend_stop, kind: code, name: stop the flow, action: amend_stop, then: end, phase: spec }
  - id: amend
    kind: agent
    name: spec amendment
    agent: explorer
    model: default
    phase: spec
    markers: [REOPEN, CONTRACT]
    instructions: >-
      The spec is frozen and approved, and it is wrong here: {{data.amend.reason}}

      Read it again first: is the behaviour already there in other words, covered by another criterion, or out of
      scope? Only if none holds, append a dated block under "## Amendments" (never edit the frozen criteria in place):
      "### <date> — <criteria>", then "Was:" (the old wording, kept visible), "Now:", "Why:" (measured, not assumed).
      Under "Now:" write each changed criterion in full, one per line ("- **AC-n** [API] <new wording>"), or for a
      layer change only "tagged [API]" (or [WEB]); when the amendment is approved keel changes the criteria lines.
      A new criterion goes in the block with the next free id. For a criterion already done under the old wording,
      say whether it is reopened or ships under the old wording and why. REOPEN lists the done criteria to build
      again (or none); CONTRACT is yes when the outside surface (routes, schemas) changes.
  - { id: amend_show, kind: code, name: the amendment for the gate, action: spec_amendment, back: amend, phase: spec }
  - { id: amend_changed, kind: branch, name: "did the spec change?", when: { data: amend.route, equals: gate }, no: amend_none, phase: spec }
  - id: amend_gate
    kind: gate
    name: spec amendment
    lock: true
    phase: spec
    choices: { approve: amend_commit, context: amend, change: amend, rebuild: rebuild }
  - { id: amend_commit, kind: code, name: commit the amendment, action: spec_amend_commit, phase: spec }
  - { id: amend_contract, kind: branch, name: the contract moves, when: { marker: CONTRACT, equals: "yes", step: amend_commit }, no: red, phase: spec }
  - { id: amend_to_contract, kind: code, name: back to the contract, then: contract, phase: contract }
  - { id: amend_none, kind: branch, name: "an order question?", when: { data: amend.route, equals: reorder }, no: amend_loop, phase: spec }
  - { id: amend_reordered, kind: code, name: the other criterion first, then: red, phase: spec }
  - id: rebuild
    kind: code
    name: start the spec again in a new feature flow
    action: start_flow
    flow: feature
    then: end
    phase: spec
    seed: { title: $title, evidence: $data.amend.reason }
  - { id: e2e_unrun, kind: code, name: e2e specs without a tool, action: e2e_unrun, then: e2e, phase: e2e }
  - { id: ready_diff, kind: code, name: the branch diff before ship, action: ship_ready, then: ready_gate, phase: ship }
  - { id: ready_amend, kind: code, name: to the amendment, action: amend_start, then: amend_entry, phase: spec }
  - { id: ready_stop, kind: code, name: stop before ship, action: ship_stop, then: end, phase: ship }
