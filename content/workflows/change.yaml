id: change
name: change (keel)
keel_rules: true
version: 1
about: "a change to the code: 1–3 criteria, test-first, then ship"
group: build
# Work without a spec. Triage asks one question: could a test notice a difference? No → trivial (one refactor commit).
# Yes → small (1 to change.max_inline_acs criteria, CHG-<n>.<m>, the test-first loop, one gate at the end) unless it
# touches the contract, a migration or auth, needs more criteria, or rests on outside docs the repo does not hold (0.18.21:
# the feature flow researches those on the web) → a feature flow with the inline criteria.
# A commit that trips an escalation trigger asks again: escalate (feature flow, commits kept) or stay small with a
# reason (recorded as escalation-override [trigger], shown in the PR body); the reason covers only the triggers it was
# given for, a different one later asks again. A suggest trigger (both apps changed) is noted once at the end gate and
# in the final review; it does not block.
steps:
  - id: triage
    kind: agent
    name: triage
    agent: explorer
    model: default
    phase: triage
    markers: [SIZE]
    instructions: >-
      Triage this change with one question: could a test notice a difference? No → trivial (refactor, rename,
      formatting, docs, a dependency bump with no effect, a UI typo): write no criteria. Yes → does it touch the
      contract, a migration or auth, need more than three criteria, or rest on details of a third-party API, webhook or
      library that this repository does not hold (field names, payload formats, limits)? Then it is a feature (0.18.21:
      the feature flow researches them on the web before its spec). Otherwise it is small: one
      to three criteria. A trivial change may add new test files but never edit an existing test, so a change that must
      edit one (a rename the tests call, say) is small, not trivial. Say the size, the reason and the files you expect to
      touch. SIZE is trivial, small or feature.
  - { id: size, kind: code, name: size + criteria, action: change_size, phase: triage }
  - { id: scope_gate, kind: gate, name: scope check, back: triage, lock: true, phase: small-change, choices: [small, trivial, feature], recommend: SIZE }
  - { id: is_feature, kind: branch, name: escalate to a feature, when: { marker: CHOICE, equals: feature, step: scope_gate }, no: is_trivial, phase: small-change }
  - id: to_feature
    kind: code
    name: start the feature flow with the inline criteria
    action: start_flow
    flow: feature
    then: end
    phase: small-change
    seed: { title: $title, acs: $acs, escalated_from: change }
  - { id: is_trivial, kind: branch, name: trivial, when: { marker: CHOICE, equals: trivial, step: scope_gate }, no: small, phase: small-change }
  - id: trivial
    kind: agent
    name: trivial change
    agent: implementer
    model: default
    phase: trivial
    instructions: >-
      Make the change. Nothing observable may change: do not touch existing tests, the contract or migrations. If the
      change needs an existing test edited, it is not trivial: stop and say so.
  # keel refuses a "trivial" commit that edits an existing test: then it was not trivial, so triage again at once. A
  # red suite is only a failed try: two more rounds with the implementer before the work is put back and triaged again.
  - { id: trivial_commit, kind: code, name: verify + trivial commit, action: verify_green+commit, lock: true, phase: trivial, rounds: 2, after_rounds: not_trivial, then: ship_plan }
  - { id: small, kind: code, name: small change, action: change_start, phase: small-change, rounds: 1, back: triage }
  - { id: red, kind: agent, name: red, agent: test-author, model: default, phase: red, per_ac: true }
  - { id: verify_red, kind: code, name: verify_red, action: verify_red+commit, phase: red, per_ac: true, lock: true }
  - { id: green, kind: agent, name: green, agent: implementer, model: default, phase: green, per_ac: true }
  - { id: verify_green, kind: code, name: verify_green + commit, action: verify_green+commit, phase: green, per_ac: true, lock: true }
  # 0.18.28 the tests outside this criterion's own filter (checks.after_green: none | changed | suite; default changed,
  # with the whole suite every checks.suite_every criteria and at each lane's end); a failure goes back to green
  - { id: ac_suite, kind: code, name: the tests outside this criterion, action: verify_after_green, back: green, phase: green, per_ac: true }
  - { id: ac_gate, kind: gate, name: AC gate, back: red, lock: true, phase: gate, per_ac: true }
  - { id: ship, kind: include, name: ship, flow: ship }
  - { id: finish, kind: code, name: done, then: end, phase: close }
  # Side path, reached only by a jump.
  - { id: not_trivial, kind: code, name: not trivial; put it back and triage again, action: reset, then: triage, phase: small-change }
