# keel's own Helper commands. A plugin is a folder with this file: keel's in content/plugins/, a project's own in
# <project>/.keel/plugins/<name>/plugin.yml (a project command with the same name replaces keel's).
#
#   commands   /name in the Helper: the prompt template is sent instead; {{args}} is the rest of the line
#   context    project files the Helper is pointed at in every prompt (for example docs/ARCHITECTURE.md)
name: core
description: keel's own Helper commands.

commands:
  - name: explain
    description: Explain a file, a symbol or the selected lines in plain words
    prompt: |
      Explain {{args}} in plain words: what it does, who uses it, and anything surprising. If I selected lines or
      named a file, start there. Link every claim to file:line.

  - name: where
    description: Find where something is in the code
    prompt: |
      Where is {{args}} in this project? List the places with file:line and one line each on what happens there.
      Use the code graph first when you have it.

  - name: review
    description: Review the selected code or the branch's changes for bugs and risks
    prompt: |
      Review {{args}} for real problems: bugs, missing checks, security holes, things the spec asks for that the code
      does not do. If I named nothing, review the changes on this branch (git diff against the base branch). List each
      problem with file:line, why it is a problem, and how sure you are. Say "No problems found" if there are none.

  - name: plan
    description: Plan a change before anyone writes code
    prompt: |
      Plan this change: {{args}}. Name the files to touch (file:line where it starts), the order, the tests to write
      first, and the risks. Do not write the code.

  - name: gate
    description: Explain what the waiting gate asks and what the evidence says
    prompt: |
      A gate of the flow waits for me. Explain in plain words what it asks me to decide, what the evidence in the
      code and the checks says, and what each choice would do next. {{args}}

  - name: test
    description: Say how to test something here and which tests already cover it
    prompt: |
      How is {{args}} tested in this project? Name the existing tests (file:line), the command that runs them, and
      what is not covered yet.

context: []
