# Releases keel's own plugins as signed packages (docs/plugins/14-publishing.md), from plugin-base only:
#
#   - by itself, on a push to plugin-base that changes a plugin's keel-plugin.yml (or content/trust/keel.pub): every
#     plugin whose version has no release yet is released (a released version is left as it is). Until both secrets
#     are set, it only says so and ends (no red run).
#   - by hand (needs this file on the default branch, which keel's main does not get; so the push is the normal way):
#       gh workflow run plugins-release.yml --repo MiladNalbandi/keel-v2 --ref plugin-base -f plugins=map,db
#
# For each chosen plugin (plugins/<name>, and product): its web and api parts are built as the Dockerfile builds them
# (npm run build:plugin / build:product, ./gradlew <name>PluginJar), scripts/build-plugin.sh --no-build puts the plugin
# folder together, keel-plugin packs, lints and signs it (the secret KEEL_PUBLISHER_KEY), and it is released as
# v<version> in keel-studio/keel-plugin-<name> (the secret KEEL_STUDIO_TOKEN). keel-marketplace's sync picks the
# release up within the hour.
name: plugins-release
on:
  push:
    branches: [plugin-base]
    # a plugin's new version, or keel's publisher key (its first commit makes the first release of every plugin)
    paths: ["plugins/*/keel-plugin.yml", "product/keel-plugin.yml", "content/trust/keel.pub"]
  workflow_dispatch:
    inputs:
      plugins:
        description: 'The plugins to release: a comma list (map,db,product) or "all"'
        required: true
        default: all
        type: string
permissions:
  contents: read
concurrency:
  group: plugins-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: On plugin-base, with both secrets
        id: ready
        env:
          REF: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          HAS_KEY: ${{ secrets.KEEL_PUBLISHER_KEY != '' }}
          HAS_TOKEN: ${{ secrets.KEEL_STUDIO_TOKEN != '' }}
        run: |
          # a push before the secrets are set: say so and end without releasing (by hand it is an error)
          if [ "$EVENT" = push ] && { [ "$HAS_KEY" != "true" ] || [ "$HAS_TOKEN" != "true" ]; }; then
            echo "::notice::No release: the secrets KEEL_PUBLISHER_KEY and KEEL_STUDIO_TOKEN are not both set yet (docs/plugins/14-publishing.md)."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
          ok=1
          if [ "$REF" != "plugin-base" ]; then
            echo "::error::Run this workflow on plugin-base (gh workflow run plugins-release.yml --ref plugin-base), not on $REF."
            ok=0
          fi
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::The secret KEEL_PUBLISHER_KEY is not set. Run docs/plugins/tools/setup-signing-keys.sh (docs/plugins/14-publishing.md)."
            ok=0
          fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::The secret KEEL_STUDIO_TOKEN is not set: a fine-grained token that can make releases in keel-studio (docs/plugins/14-publishing.md)."
            ok=0
          fi
          [ "$ok" = 1 ]
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
      - name: Which plugins
        id: pick
        if: steps.ready.outputs.go == 'true'
        env:
          WANT: ${{ inputs.plugins || 'all' }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.KEEL_STUDIO_TOKEN }}
        run: |
          set -euo pipefail
          all="$(for d in plugins/*/; do if [ -f "$d/keel-plugin.yml" ]; then basename "$d"; fi; done; echo product)"
          want="$(tr -d ' ' <<< "$WANT")"
          if [ "$want" = "all" ]; then names="$all"; else names="$(tr ',' '\n' <<< "$want" | sed '/^$/d')"; fi
          # a push releases only the versions that have no release yet
          if [ "$EVENT" = push ]; then
            todo=""
            while IFS= read -r n; do
              dir="plugins/$n"; if [ "$n" = product ]; then dir=product; fi
              v="$(sed -n 's/^version:[[:space:]]*//p' "$dir/keel-plugin.yml" | tr -d "\"' \r")"
              if gh release view "v$v" --repo "keel-studio/keel-plugin-$n" > /dev/null 2>&1; then
                echo "$n $v: released already"
              else
                todo="$todo$n"$'\n'
              fi
            done <<< "$names"
            names="$(sed '/^$/d' <<< "$todo")"
            if [ -z "$names" ]; then
              echo "names=" >> "$GITHUB_OUTPUT"
              echo "Every plugin's version is released already."
              exit 0
            fi
          fi
          [ -n "$names" ] || { echo "::error::Name at least one plugin, or all."; exit 1; }
          while IFS= read -r n; do
            if ! [[ "$n" =~ ^[a-z][a-z0-9-]{0,31}$ ]] || ! grep -qx "$n" <<< "$all"; then
              echo "::error::There is no plugin '$n'. The plugins: $(paste -sd' ' - <<< "$all")."
              exit 1
            fi
          done <<< "$names"
          echo "names=$(paste -sd' ' - <<< "$names")" >> "$GITHUB_OUTPUT"
          echo "plugins: $(paste -sd' ' - <<< "$names")"
      - uses: actions/setup-node@v4
        if: steps.pick.outputs.names != ''
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-java@v4
        if: steps.pick.outputs.names != ''
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - uses: astral-sh/setup-uv@v6
        if: steps.pick.outputs.names != ''
      # the web parts, each on its own with web's node_modules (as the Dockerfile's web stage)
      - name: Build the web parts
        if: steps.pick.outputs.names != ''
        working-directory: web
        env:
          NAMES: ${{ steps.pick.outputs.names }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          web=()
          for n in $NAMES; do
            if [ "$n" = product ]; then npm run build:product
            elif [ -f "../plugins/$n/web/index.tsx" ]; then web+=("$n"); fi
          done
          if [ ${#web[@]} -gt 0 ]; then npm run build:plugin -- "${web[@]}"; fi
      # the api parts: thin plugin jars (as the Dockerfile's api stage), build/libs/keel-plugin-<name>.jar
      - name: Build the api parts
        if: steps.pick.outputs.names != ''
        working-directory: api
        env:
          NAMES: ${{ steps.pick.outputs.names }}
        run: |
          set -euo pipefail
          tasks=()
          for n in $NAMES; do
            dir="../plugins/$n"; if [ "$n" = product ]; then dir=../product; fi
            camel="$(awk -F- '{ out = $1; for (i = 2; i <= NF; i++) out = out toupper(substr($i, 1, 1)) substr($i, 2); print out }' <<< "$n")"
            if grep -Eq '^[[:space:]]+api:' "$dir/keel-plugin.yml"; then tasks+=("${camel}PluginJar"); fi
          done
          if [ ${#tasks[@]} -gt 0 ]; then ./gradlew --no-daemon -q "${tasks[@]}"; fi
      # the plugin folder (scripts/build-plugin.sh, as the Dockerfile's plugins stage), then keel-plugin's package
      - name: Pack and lint
        if: steps.pick.outputs.names != ''
        env:
          NAMES: ${{ steps.pick.outputs.names }}
        run: |
          set -euo pipefail
          kp=(uv run --quiet --project tools/keel-plugin keel-plugin)
          mkdir -p stage dist
          for n in $NAMES; do
            if [ "$n" = product ]; then bash product/build-plugin.sh stage --no-build
            else bash scripts/build-plugin.sh "plugins/$n" stage --no-build; fi
            for v in stage/"$n"/*/; do "${kp[@]}" pack "$v" --out dist; done
          done
          "${kp[@]}" lint dist/*.kplug
      - name: Sign
        if: steps.pick.outputs.names != ''
        env:
          KEEL_PUBLISHER_KEY: ${{ secrets.KEEL_PUBLISHER_KEY }}
        run: |
          set -euo pipefail
          kp=(uv run --quiet --project tools/keel-plugin keel-plugin)
          for k in dist/*.kplug; do "${kp[@]}" sign "$k" --key-env KEEL_PUBLISHER_KEY; done
          # the files must verify with the public key keel ships (content/trust/keel.pub)
          if [ -f content/trust/keel.pub ]; then
            for k in dist/*.kplug; do "${kp[@]}" verify "$k" --pub content/trust/keel.pub; done
          else
            echo "::warning::content/trust/keel.pub is missing: commit the public key setup-signing-keys.sh wrote."
          fi
      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.names != ''
        with:
          name: plugins
          path: dist/
      - name: Release in keel-studio
        if: steps.pick.outputs.names != ''
        env:
          GH_TOKEN: ${{ secrets.KEEL_STUDIO_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "| plugin | release | sha256 |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for k in dist/*.kplug; do
            file="$(basename "$k")"
            name="$(tar -xzOf "$k" keel-plugin.yml | sed -n 's/^name:[[:space:]]*//p' | tr -d "\"' \r")"
            version="${file#"$name"-}"; version="${version%.kplug}"
            title="$(tar -xzOf "$k" keel-plugin.yml | sed -n 's/^title:[[:space:]]*//p' | tr -d "\"'\r")"
            repo="keel-studio/keel-plugin-$name"
            tag="v$version"
            if gh release view "$tag" --repo "$repo" > /dev/null 2>&1; then
              gh release upload "$tag" "$k" "$k.minisig" --repo "$repo" --clobber
              echo "$repo $tag: new files"
            else
              pre=false
              if [[ "$version" == *-* ]]; then pre=true; fi
              gh release create "$tag" "$k" "$k.minisig" --repo "$repo" --prerelease="$pre" --title "${title:-$name} $version" \
                --notes "keel plugin ${title:-$name} $version, built from keel-v2 plugin-base ($SHA). Install it in keel: Control › Plugins › Marketplace."
              echo "$repo $tag: released"
            fi
            echo "| $name | [$tag](https://github.com/$repo/releases/tag/$tag) | \`$(sha256sum "$k" | cut -d' ' -f1)\` |" >> "$GITHUB_STEP_SUMMARY"
          done
