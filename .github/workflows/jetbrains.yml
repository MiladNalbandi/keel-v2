name: jetbrains

# The keel plugin for JetBrains IDEs (jetbrains/): build, test, verify, and keep the zip.
on:
  push:
    paths: ["jetbrains/**", ".github/workflows/jetbrains.yml"]
  pull_request:
    paths: ["jetbrains/**", ".github/workflows/jetbrains.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jetbrains-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jetbrains
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6
      - name: Test
        run: ./gradlew test --console=plain
      - name: Build the plugin
        run: ./gradlew buildPlugin --console=plain
      - name: Verify against IntelliJ IDEA 2024.3
        run: ./gradlew verifyPlugin --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: keel-jetbrains
          path: jetbrains/build/distributions/keel-jetbrains-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: jetbrains-test-reports
          path: jetbrains/build/reports/
