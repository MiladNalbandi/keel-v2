# Runs the three test suites and checks the shell scripts on every push and pull request.
name: ci
on:
  push:
    branches: [main, "release/**"]
  pull_request:
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n keel2 && bash -n install.sh && bash -n docker/keel-start
      - run: shellcheck -S error keel2 install.sh docker/keel-start
      - run: ./keel2 help | grep -q "keel2 start" && ./keel2 version
      # keel2 mcp: the client config names this script; --with-keel-v1 refuses a folder without mcp/server.js
      - run: |
          ./keel2 help | grep -q "keel2 mcp"
          ./keel2 mcp --print-config | grep -q "claude mcp add keel-v2 -- $PWD/keel2 mcp$"
          ./keel2 mcp --write --print-config | grep -q '"args": \["mcp", "--write"\]'
          ! ./keel2 start --with-keel-v1 /tmp
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: uv sync && uv run pytest -q
        working-directory: engine
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - run: ./gradlew --no-daemon test
        working-directory: api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npx tsc --noEmit && npm test -- --run && npm run build
        working-directory: web
