# Runs the three test suites (keel's core and every plugin in plugins/), the keel-plugin tool's tests, and checks the
# shell scripts on every push and pull request.
name: ci
on:
  push:
    branches: [main, "release/**", plugin-base]   # plugin-base: the plugin track (never merged into main)
  pull_request:
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n keel2 && bash -n install.sh && bash -n docker/keel-start && bash -n docker/keel-native-start && bash -n scripts/build-native.sh && bash -n scripts/test-keel2-native.sh
      # keel v2 does not depend on keel v1 (0.4.1): any line that still does fails the build
      - run: scripts/no-v1.sh --strict
      - run: shellcheck -S error keel2 install.sh docker/keel-start docker/keel-native-start scripts/build-native.sh scripts/test-keel2-native.sh product/build-plugin.sh docker/tests/keel-start.test.sh docker/tests/keel2.test.sh scripts/build-plugin.sh scripts/test-plugins.sh
      # v0.17.2 keel2's data volume: its own per KEEL_NAME, never one another running keel uses (fake docker)
      - run: shellcheck -S error scripts/test-keel2-volume.sh && bash scripts/test-keel2-volume.sh
      - run: shellcheck -S error scripts/test-keel2-auth.sh && bash scripts/test-keel2-auth.sh
      # the plugin publishing scripts (docs/plugins/14-publishing.md), and step 5's: the plugin repos and plugins.lock
      - run: shellcheck -S error docs/plugins/tools/setup-signing-keys.sh docs/plugins/marketplace-repo/.github/fetch-releases.sh
      - run: shellcheck -S error docs/plugins/tools/split-plugin.sh scripts/build-plugin-repo.sh scripts/fetch-locked-plugins.sh scripts/update-plugins-lock.sh
      # plugins.lock's lines (PLUGINS=lock reads them; the keel-plugin job tests the download and its refusals)
      - run: scripts/fetch-locked-plugins.sh --check plugins.lock
      # keel2 update / update --rollback in native mode, with fake releases (no network, no Java)
      - uses: astral-sh/setup-uv@v7
      - run: scripts/test-keel2-native.sh
      - run: ./keel2 help | grep -q "keel2 start" && ./keel2 version
      # keel-start, the supervisor loop (restart on exit 75, fallback to the last good plugins), with stub commands
      - run: docker/tests/keel-start.test.sh
      # keel2 start --core (the :core image), restart and update keep it, status says the edition; a stub docker
      - run: docker/tests/keel2.test.sh
      # keel2 mcp: the client config names this script; --with-keel-v1 refuses a folder without mcp/server.js
      - run: |
          ./keel2 help | grep -q "keel2 mcp"
          ./keel2 mcp --print-config | grep -q "claude mcp add keel-v2 -- $PWD/keel2 mcp$"
          ./keel2 mcp --write --print-config | grep -q '"args": \["mcp", "--write"\]'
          ! ./keel2 start --with-keel-v1 /tmp
      # keel2 add / remove / folders: the list of added folders works without Docker or a running keel
      - run: |
          ./keel2 help | grep -q "keel2 add"
          export KEEL_NAME=keel-ci-folders XDG_CONFIG_HOME="$(mktemp -d)"
          repo="$(mktemp -d)" && git init -q "$repo"
          ./keel2 folders | grep -q "No added folders"
          ./keel2 add "$repo" </dev/null
          ./keel2 folders | grep -qF "added    $(cd "$repo" && pwd -P)"
          ./keel2 remove "$repo"
          ./keel2 folders | grep -q "No added folders"
  keel-plugin:
    # tools/keel-plugin, the publishing tool (docs/plugins/13-step4-contract.md section 10): the signature test vector,
    # keygen/sign/verify, pack and lint (also against scripts/build-plugin.sh), the catalog index, the template, and
    # setup-signing-keys.sh --dry-run with a stand-in gh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --with pytest pytest -q
        working-directory: tools/keel-plugin
  # v0.16.1 native mode (keel2 start --native): build the release tarball, start keel without Docker on the fake model,
  # run a flow to its first gate, stop it, and check nothing is left running or written outside its folders
  native-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - uses: astral-sh/setup-uv@v7
      - run: scripts/build-native.sh "$RUNNER_TEMP/dist"
      - name: start, a flow to its gate, stop
        env:
          KEEL_NAME: keel-ci-native
          KEEL2_HOME: ${{ runner.temp }}/k2
          XDG_CONFIG_HOME: ${{ runner.temp }}/cfg
          PORT: "8097"
          KEEL_OPEN: "0"
          KEEL_YES: "1"
          KEEL_NATIVE_CLIS: "0"
          KEEL_FAKEONREALPROJECTS: "true"
        run: |
          repo="$RUNNER_TEMP/repo" && mkdir -p "$repo" && git -C "$repo" init -q -b main
          printf '# demo\n' > "$repo/README.md" && git -C "$repo" add -A && git -C "$repo" -c user.name=ci -c user.email=ci@localhost commit -qm init
          ./keel2 start --native --from-tarball "$(ls "$RUNNER_TEMP"/dist/*.tar.gz)" "$repo"
          ./keel2 status | grep -q "running natively"
          # v0.18.1 every api caller proves who it is: a terminal client sends the sign-in key
          auth="Authorization: Bearer $(./keel2 auth key)"
          pid="$(curl -fs -H "$auth" http://127.0.0.1:8097/api/projects | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["id"])')"
          curl -fs -X POST "http://127.0.0.1:8097/api/projects/$pid/flows" -H "$auth" -H 'content-type: application/json' \
            -d '{"workflow_id":"feature","title":"Scores","request":"Save a score."}' > /dev/null
          for _ in $(seq 1 60); do
            st="$(curl -fs -H "$auth" "http://127.0.0.1:8097/api/projects/$pid/flow" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("thread") or {}).get("status"))')"
            [ "$st" = waiting ] && break; sleep 2
          done
          test "$st" = waiting
          ls "$repo/.keel/specs"/*.md
          ./keel2 mcp --print-config | grep -q "keel2 mcp"
          ./keel2 stop
          ! pgrep -f "$RUNNER_TEMP/k2" > /dev/null
          test ! -e "$HOME/.keel2"
  engine:
    runs-on: ubuntu-latest
    # v0.10.0 the Database plugin's tests run against a real PostgreSQL and MySQL
    # (plugins/db/engine/tests/test_plugins_servers.py, in scripts/test-plugins.sh below)
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: scores }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: shop, MYSQL_USER: app, MYSQL_PASSWORD: app }
        ports: ["53306:3306"]
        options: --health-cmd "mysqladmin ping -uroot -proot --silent" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      KEEL_TEST_PG: postgres://app:app@127.0.0.1:55432/scores  # keel:allow-secret
      KEEL_TEST_MYSQL: mysql://app:app@127.0.0.1:53306/shop  # keel:allow-secret
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      # Like the image: projects run their tests with the system Python (keel keeps its own venv off their PATH),
      # and the demo project's checks run `python -m pytest` for real.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pytest python-is-python3
      - run: uv sync && uv run pytest -q
        working-directory: engine
      # every plugin's engine tests (plugins/<name>/engine/tests), each with its own engine folder on PYTHONPATH
      - run: scripts/test-plugins.sh
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      # keel's tests, then every plugin's api tests and jars (plugins/<name>/api)
      - run: ./gradlew --no-daemon test pluginTest pluginJars
        working-directory: api
  product:
    # keel Product, the plugin in product/ (beta): its engine part inside keel's engine (and its manifest, packed by
    # product/build-plugin.sh), its api part with keel's api and as a plugin jar (its web pages are tested in the web job)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - run: uv sync && PYTHONPATH=../product/engine uv run pytest -q ../product/engine/tests
        working-directory: engine
      - run: ./gradlew --no-daemon productTest productPluginJar
        working-directory: api
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm, cache-dependency-path: cli/package-lock.json }
      # keel TUI: imports web/src/api.ts and KeelBot's client as they are, so it typechecks against them
      - run: npm ci && npx tsc --noEmit && npm test -- --run && npm run build && node dist/keel-tui.mjs --version
        working-directory: cli
  xal-plugin:
    # keel as an xal plugin (clients/xal): no dependencies at run time, Node's own test runner on the .ts files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: node --test test/*.test.ts && npm install --no-save --no-audit --no-fund typescript@5.9.3 @types/node@24 && npx tsc --noEmit -p .
        working-directory: clients/xal
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      # vitest runs the plugins' web tests too (../plugins/*/web); each plugin's web part builds on its own
      - run: npm ci && npx tsc --noEmit && npm test -- --run && npm run build && npm run build:plugins && npm run build:product
        working-directory: web
