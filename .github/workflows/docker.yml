# Builds keel v2's images and pushes them to
#   ghcr.io/<owner>/<repo>          always: the repo's own name
#   ghcr.io/miladnalbandi/keel-v2   the old name, while the secret LEGACY_GHCR_TOKEN exists (a token of MiladNalbandi
#                                   with write:packages), so installs made before a move keep getting updates
#   docker.io/<user>/keel-v2        when the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN exist
# Three editions, each for amd64 and arm64:
#   full     :<version>, :<major>.<minor>, :latest (not on a pre-release tag such as v0.18.2-rc.1)
#   core     :<version>-core, :core (with :latest)                      keel's core only: keel2 start --core
#   product  :<version>-product-beta, :product-beta (never :latest; not moved by a pre-release)  keel Product, beta
#
# v0.18.2 fast builds: every edition × architecture builds at the same time on its OWN kind of machine (arm64 on
# GitHub's arm runners: no QEMU emulation); a short merge job per edition joins the two architectures into one
# multi-arch tag set. The build cache lives in the registry (<image>:buildcache-<edition>-<arch>), not in GitHub's
# 10 GB Actions cache, and every edition also reads the full edition's cache (the stages they share).
#
# 0.18.34 the images build WHILE ci runs, and get their release tags only after ci passed:
#
#   push to release/**   plan → build (all 6, NO gate)   each image is pushed under a staging tag only:
#                        ghcr.io/<owner>/<repo>:stage-<sha>-<edition>-<arch>   (never a version, latest, core or product tag)
#   push of tag v*       plan (are the 6 staging tags of this sha there? a staging build that still runs is awaited)
#                        gate (ci must have passed for this sha) → build (only what is missing: the old path)
#                        → merge (the staging images become the version / minor / latest / core / product-beta tags)
#
# So a release script that pushes release/<x> first (ci and this workflow start together) and tags when ci is green
# finds the images ready: the tag run only gates and tags (about a minute). A tag made without the release-branch push
# builds as before. Nothing gets a release tag unless the gate saw a passing ci run for that exact commit.
# Staging tags are never deleted by this workflow: a package version IS the image digest, which the release tags use
# too (see docker-stage-cleanup.yml for the guarded clean-up).
name: docker
on:
  push:
    branches: ["release/**"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  LEGACY_IMAGE: ghcr.io/miladnalbandi/keel-v2
  LEGACY_USER: MiladNalbandi
jobs:
  # What has to be built: on a release branch (or a manual run on a branch) everything, as staging images; on a tag
  # only the edition × architecture pairs without a staging image for this commit. Output: the matrix for `build`.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: read
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      count: ${{ steps.p.outputs.count }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="$(echo "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          release=0; case "$GITHUB_REF" in refs/tags/*) release=1 ;; esac
          missing=()
          find_missing() {
            missing=()
            for e in full core product; do for a in amd64 arm64; do
              if [ "$release" = 1 ] && docker buildx imagetools inspect "$image:stage-$SHA-$e-$a" > /dev/null 2>&1; then
                echo "staging image there: $e $a"
              else
                missing+=("$e:$a")
              fi
            done; done
          }
          find_missing
          # a staging build of this commit that is still running (the release-branch push) is awaited, up to 40 minutes,
          # instead of building everything twice
          if [ "$release" = 1 ] && [ "${#missing[@]}" -gt 0 ]; then
            for i in $(seq 1 80); do
              running="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow docker.yml --commit "$SHA" --json databaseId,status,headBranch --limit 20 \
                | jq --argjson me "$GITHUB_RUN_ID" '[.[] | select(.databaseId != $me and .status != "completed" and (.headBranch | startswith("release/")))] | length')"
              [ "$running" -gt 0 ] || break
              echo "the staging build for $SHA is still running (${i}/80)…"; sleep 30
            done
            find_missing
          fi
          matrix="$(for m in "${missing[@]}"; do
            e="${m%%:*}"; a="${m##*:}"
            case "$a" in amd64) p=linux/amd64; r=ubuntu-latest ;; *) p=linux/arm64; r=ubuntu-24.04-arm ;; esac
            jq -nc --arg e "$e" --arg a "$a" --arg p "$p" --arg r "$r" '{edition: $e, arch: $a, platform: $p, runner: $r}'
          done | jq -sc '{include: .}')"
          echo "to build: ${#missing[@]} of 6"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=${#missing[@]}" >> "$GITHUB_OUTPUT"

  # 0.18.x nothing is published before ci passed for this very commit: ci runs on the push to main / release/** that
  # a tag points at (a tag alone does not start ci). The gate waits (up to 40 minutes) for a ci run that is still going.
  # Only a tag needs it: a release-branch run builds staging images, which no one installs.
  gate:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: ci must have passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 80); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --json status,conclusion --limit 20)"
            ok="$(jq '[.[] | select(.conclusion == "success")] | length' <<< "$runs")"
            pending="$(jq '[.[] | select(.status != "completed")] | length' <<< "$runs")"
            if [ "$ok" -gt 0 ]; then echo "ci passed for $SHA."; exit 0; fi
            if [ "$pending" -eq 0 ] && [ "$(jq length <<< "$runs")" -gt 0 ]; then
              echo "::error::ci did not pass for $SHA: no image is published. Fix it and tag a new commit."; exit 1
            fi
            echo "ci for $SHA is not done yet (${i}/80)…"; sleep 30
          done
          echo "::error::There is no passing ci run for $SHA (ci runs on a push to main or release/**). Push the commit there first."; exit 1
  build:
    needs: [plan, gate]
    # gate is skipped on a release-branch run (no gate there), and must have passed on a tag run
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.count != '0' && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # a staging tag only (the exact commit, edition and architecture): the merge job puts the release tags on
          tags: ${{ steps.image.outputs.name }}:stage-${{ github.sha }}-${{ matrix.edition }}-${{ matrix.arch }}
          push: true
          build-args: |
            INSTALL_CLIS=1
            EDITION=${{ matrix.edition }}
          labels: |
            org.opencontainers.image.title=keel v2 (${{ matrix.edition }})
            org.opencontainers.image.licenses=MIT
          cache-from: |
            type=registry,ref=${{ steps.image.outputs.name }}:buildcache-${{ matrix.edition }}-${{ matrix.arch }}
            type=registry,ref=${{ steps.image.outputs.name }}:buildcache-full-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-${{ matrix.edition }}-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true
      - run: echo "${{ steps.image.outputs.name }}:stage-${{ github.sha }}-${{ matrix.edition }}-${{ matrix.arch }} ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  merge:
    needs: [plan, gate, build]
    # a tag run only; ci passed (gate); every image that had to be built was built (a skipped build = all were there)
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.plan.result == 'success' && needs.gate.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        edition: [full, core, product]
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      HAS_LEGACY: ${{ secrets.LEGACY_GHCR_TOKEN != '' }}
    steps:
      - uses: docker/setup-buildx-action@v4
      # one login per registry: the legacy token can push both names, the workflow's token only the repo's own
      - uses: docker/login-action@v4
        if: env.HAS_LEGACY != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: env.HAS_LEGACY == 'true'
        with:
          registry: ghcr.io
          username: ${{ env.LEGACY_USER }}
          password: ${{ secrets.LEGACY_GHCR_TOKEN }}
      - uses: docker/login-action@v4
        if: env.HAS_DOCKERHUB == 'true' && matrix.edition != 'product'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: tag the two staging images as one multi-arch image
        env:
          EDITION: ${{ matrix.edition }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          names="$image"
          if [ "$HAS_LEGACY" = "true" ] && [ "$image" != "$LEGACY_IMAGE" ]; then names="$names $LEGACY_IMAGE"; fi
          if [ "$HAS_DOCKERHUB" = "true" ] && [ "$EDITION" != product ]; then names="$names docker.io/${{ secrets.DOCKERHUB_USERNAME }}/keel-v2"; fi
          case "$REF" in v*) version="${REF#v}" ;; *) echo "not a version tag ($REF): the images stay untagged"; exit 0 ;; esac
          pre=0; case "$version" in *-*) pre=1 ;; esac
          minor="$(echo "$version" | cut -d. -f1-2)"
          tags=()
          for n in $names; do
            case "$EDITION" in
              full)    tags+=("$n:$version"); [ $pre = 1 ] || tags+=("$n:$minor" "$n:latest") ;;
              core)    tags+=("$n:$version-core"); [ $pre = 1 ] || tags+=("$n:core") ;;
              product) tags+=("$n:$version-product-beta"); [ $pre = 1 ] || tags+=("$n:product-beta") ;;
            esac
          done
          # the sources: the staging image of THIS commit for each architecture (built by the release-branch push or by build above)
          sources=()
          for a in amd64 arm64; do
            s="$image:stage-$SHA-$EDITION-$a"
            docker buildx imagetools inspect "$s" > /dev/null || { echo "::error::The staging image $s is missing: nothing is tagged."; exit 1; }
            sources+=("$s")
          done
          args=(); for tg in "${tags[@]}"; do args+=(-t "$tg"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          for tg in "${tags[@]}"; do echo "$tg"; done
          docker buildx imagetools inspect "${tags[0]}"

  # v0.16.1 the native release (keel2 start --native downloads it): keel-v2-<version>-native.tar.gz and its sha256,
  # attached to the GitHub release of the tag when there is one, else kept as the run's artifact
  native:
    needs: gate
    # a pre-release tag (v0.18.2-rc.1) tests the images only: the native release needs the engine's own version
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      # keel2 downloads v<version>/keel-v2-<version>-native.tar.gz: the tag must be the engine's version
      - run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' engine/pyproject.toml | head -1)" = "$GITHUB_REF_NAME"
      - run: scripts/build-native.sh dist
      - name: attach to the release
        id: attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --clobber && echo "attached=1" >> "$GITHUB_OUTPUT"
          else
            echo "No GitHub release for $GITHUB_REF_NAME yet: the files are kept as this run's artifact."
          fi
      - if: steps.attach.outputs.attached != '1'
        uses: actions/upload-artifact@v7
        with:
          name: keel-v2-native
          path: dist/
