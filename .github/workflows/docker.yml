# Builds the one image for amd64 + arm64 and pushes it to Docker Hub on a version tag (v*).
# Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. Optional variable KEEL_REF pins keel v1 (default main).
name: docker
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/keel-v2
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            INSTALL_CLIS=1
            KEEL_REF=${{ vars.KEEL_REF || 'main' }}
