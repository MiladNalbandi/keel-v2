# Builds the image for amd64 + arm64 on a version tag (v*) and pushes it to
#   ghcr.io/<owner>/<repo>          always: the repo's own name (keel-studio/keel-app once the repo moved there)
#   ghcr.io/miladnalbandi/keel-v2   the old name, while the secret LEGACY_GHCR_TOKEN exists (a token of MiladNalbandi
#                                   with write:packages), so installs made before the move keep getting updates
#   docker.io/<user>/keel-v2        when the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN exist
# and the product edition (keel Product, beta) to <image>:<version>-product-beta and :product-beta for each ghcr name,
# which never move :latest.
name: docker
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  LEGACY_IMAGE: ghcr.io/miladnalbandi/keel-v2
  LEGACY_USER: MiladNalbandi
jobs:
  image:
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      HAS_LEGACY: ${{ secrets.LEGACY_GHCR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # one login per registry: the legacy token can push both names, the workflow's token only the repo's own
      - uses: docker/login-action@v4
        if: env.HAS_LEGACY != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: env.HAS_LEGACY == 'true'
        with:
          registry: ghcr.io
          username: ${{ env.LEGACY_USER }}
          password: ${{ secrets.LEGACY_GHCR_TOKEN }}
      - uses: docker/login-action@v4
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: names
        run: |
          images="$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ "$HAS_LEGACY" = "true" ] && [ "$images" != "$LEGACY_IMAGE" ]; then images="${images}"$'\n'"${LEGACY_IMAGE}"; fi
          if [ "$HAS_DOCKERHUB" = "true" ]; then images="${images}"$'\n'"docker.io/${{ secrets.DOCKERHUB_USERNAME }}/keel-v2"; fi
          { echo "images<<EOF"; echo "$images"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # A pre-release tag (v0.4.0-rc.1) publishes :0.4.0-rc.1 only; :latest moves on real releases.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=keel v2
            org.opencontainers.image.description=keel's test-first flow as a LangGraph graph, with a dashboard, in one image
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTALL_CLIS=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
  product:
    # keel Product (product/, an add-on) is beta: its edition gets its own tags and never :latest
    runs-on: ubuntu-latest
    env:
      HAS_LEGACY: ${{ secrets.LEGACY_GHCR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.HAS_LEGACY != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: env.HAS_LEGACY == 'true'
        with:
          registry: ghcr.io
          username: ${{ env.LEGACY_USER }}
          password: ${{ secrets.LEGACY_GHCR_TOKEN }}
      - id: names
        run: |
          image="$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          images="$image"
          if [ "$HAS_LEGACY" = "true" ] && [ "$image" != "$LEGACY_IMAGE" ]; then images="$image $LEGACY_IMAGE"; fi
          version="${GITHUB_REF_NAME#v}"
          { echo "tags<<EOF"; for i in $images; do echo "$i:${version}-product-beta"; echo "$i:product-beta"; done; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          labels: |
            org.opencontainers.image.title=keel v2 with keel Product (beta)
            org.opencontainers.image.licenses=MIT
          build-args: |
            INSTALL_CLIS=1
            EDITION=product
          cache-from: type=gha
          cache-to: type=gha,mode=max
