# Builds the image for amd64 + arm64 on a version tag (v*) and pushes it to
#   ghcr.io/<owner>/<repo>          always: the repo's own name (keel-studio/keel-app once the repo moved there)
#   ghcr.io/miladnalbandi/keel-v2   the old name, while the secret LEGACY_GHCR_TOKEN exists (a token of MiladNalbandi
#                                   with write:packages), so installs made before the move keep getting updates
#   docker.io/<user>/keel-v2        when the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN exist
# and the product edition (keel Product, beta) to <image>:<version>-product-beta and :product-beta for each ghcr name,
# which never move :latest. The core edition (keel's core only, no plugin inside: keel2 start --core) goes next to
# :latest, to the same names: <image>:<version>-core always, and :core when :latest moves (a real release).
name: docker
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  LEGACY_IMAGE: ghcr.io/miladnalbandi/keel-v2
  LEGACY_USER: MiladNalbandi
jobs:
  image:
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      HAS_LEGACY: ${{ secrets.LEGACY_GHCR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # one login per registry: the legacy token can push both names, the workflow's token only the repo's own
      - uses: docker/login-action@v4
        if: env.HAS_LEGACY != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: env.HAS_LEGACY == 'true'
        with:
          registry: ghcr.io
          username: ${{ env.LEGACY_USER }}
          password: ${{ secrets.LEGACY_GHCR_TOKEN }}
      - uses: docker/login-action@v4
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: names
        run: |
          images="$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ "$HAS_LEGACY" = "true" ] && [ "$images" != "$LEGACY_IMAGE" ]; then images="${images}"$'\n'"${LEGACY_IMAGE}"; fi
          if [ "$HAS_DOCKERHUB" = "true" ]; then images="${images}"$'\n'"docker.io/${{ secrets.DOCKERHUB_USERNAME }}/keel-v2"; fi
          { echo "images<<EOF"; echo "$images"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # A pre-release tag (v0.4.0-rc.1) publishes :0.4.0-rc.1 only; :latest moves on real releases.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=keel v2
            org.opencontainers.image.description=keel's test-first flow as a LangGraph graph, with a dashboard, in one image
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTALL_CLIS=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
  core:
    # keel's core only (EDITION=core, docs/plugins/16-steps5-7-contract.md step 6): the plugins are added from the
    # marketplace. :<version>-core on every tag; :core moves with :latest (not on a pre-release tag such as v0.4.0-rc.1)
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      HAS_LEGACY: ${{ secrets.LEGACY_GHCR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.HAS_LEGACY != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: env.HAS_LEGACY == 'true'
        with:
          registry: ghcr.io
          username: ${{ env.LEGACY_USER }}
          password: ${{ secrets.LEGACY_GHCR_TOKEN }}
      - uses: docker/login-action@v4
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: names
        run: |
          image="$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          images="$image"
          if [ "$HAS_LEGACY" = "true" ] && [ "$image" != "$LEGACY_IMAGE" ]; then images="$images $LEGACY_IMAGE"; fi
          if [ "$HAS_DOCKERHUB" = "true" ]; then images="$images docker.io/${{ secrets.DOCKERHUB_USERNAME }}/keel-v2"; fi
          version="${GITHUB_REF_NAME#v}"
          {
            echo "tags<<EOF"
            for i in $images; do
              echo "$i:${version}-core"
              case "$GITHUB_REF_NAME" in *-*) ;; *) echo "$i:core" ;; esac
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          labels: |
            org.opencontainers.image.title=keel v2, core only
            org.opencontainers.image.description=keel's core without plugins: add them from Control › Plugins
            org.opencontainers.image.licenses=MIT
          build-args: |
            INSTALL_CLIS=1
            EDITION=core
          cache-from: type=gha
          cache-to: type=gha,mode=max
  product:
    # keel Product (product/, an add-on) is beta: its edition gets its own tags and never :latest
    runs-on: ubuntu-latest
    env:
      HAS_LEGACY: ${{ secrets.LEGACY_GHCR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.HAS_LEGACY != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: env.HAS_LEGACY == 'true'
        with:
          registry: ghcr.io
          username: ${{ env.LEGACY_USER }}
          password: ${{ secrets.LEGACY_GHCR_TOKEN }}
      - id: names
        run: |
          image="$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          images="$image"
          if [ "$HAS_LEGACY" = "true" ] && [ "$image" != "$LEGACY_IMAGE" ]; then images="$image $LEGACY_IMAGE"; fi
          version="${GITHUB_REF_NAME#v}"
          { echo "tags<<EOF"; for i in $images; do echo "$i:${version}-product-beta"; echo "$i:product-beta"; done; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          labels: |
            org.opencontainers.image.title=keel v2 with keel Product (beta)
            org.opencontainers.image.licenses=MIT
          build-args: |
            INSTALL_CLIS=1
            EDITION=product
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # v0.16.1 the native release (keel2 start --native downloads it): keel-v2-<version>-native.tar.gz and its sha256,
  # attached to the GitHub release of the tag when there is one, else kept as the run's artifact
  native:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      # keel2 downloads v<version>/keel-v2-<version>-native.tar.gz: the tag must be the engine's version
      - run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' engine/pyproject.toml | head -1)" = "$GITHUB_REF_NAME"
      - run: scripts/build-native.sh dist
      - name: attach to the release
        id: attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --clobber && echo "attached=1" >> "$GITHUB_OUTPUT"
          else
            echo "No GitHub release for $GITHUB_REF_NAME yet: the files are kept as this run's artifact."
          fi
      - if: steps.attach.outputs.attached != '1'
        uses: actions/upload-artifact@v7
        with:
          name: keel-v2-native
          path: dist/
