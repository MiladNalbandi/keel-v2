# Dependabot: one look a week at each part's dependencies, the Docker base images and the GitHub Actions.
# Minor and patch updates of a part come as one pull request; a major update gets its own, so it can be read alone.
# CI (ci.yml) runs on every pull request, so a broken update shows before anyone merges it.

version: 2

updates:

  - package-ecosystem: uv                  # engine/: Python, uv.lock
    directory: /engine
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(engine)"
    groups:
      engine-minor:
        update-types: [minor, patch]

  - package-ecosystem: gradle              # api/: Kotlin, Spring Boot
    directory: /api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(api)"
    groups:
      api-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm                 # web/: React, Vite
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(web)"
    groups:
      web-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker              # the base images in the Dockerfile
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"
    ignore:
      # the image pins Node 20 and JDK 21 on purpose: a new major is a decision, not a weekly update
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions      # .github/workflows/*.yml
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(ci)"
    groups:
      actions:
        patterns: ["*"]
